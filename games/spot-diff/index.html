<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>틀린그림찾기 · 아기자기한 다섯 장면</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FDF3DF">
<meta name="description" content="아기자기한 그림에서 다른 곳 5개를 찾는 틀린그림찾기. 토끼의 방, 고양이 베이커리, 숲속 피크닉, 곰돌이 장난감 가게, 밤하늘 캠핑카 5개 장면.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --ink:#6B4F3A; --ink2:#8C6A52; --line:#D9BFA4;
    --cream:#FFF8EC; --paper:#FCF2E1;
    --pink:#F6B3C0; --mint:#BFE3CF; --butter:#FBE3A4; --sky:#C4E4F3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 85% at 50% 0%, #FFFCF4 0%, #FCF0D9 48%, #F1DDBD 100%);
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
    -webkit-text-size-adjust:100%;
  }
  #app{
    position:fixed;inset:0;display:flex;flex-direction:column;
    width:100%;max-width:520px;margin:0 auto;
    padding:calc(env(safe-area-inset-top,0px) + 6px) 10px calc(env(safe-area-inset-bottom,0px) + 8px);
  }
  @media (min-width:760px){
    #app{padding-top:16px;padding-bottom:16px;}
    .card{max-width:380px;}
  }

  /* ---------- HUD ---------- */
  #hud{flex:0 0 auto;padding:0 2px 6px;}
  .row1{display:flex;align-items:center;gap:6px;height:34px;}
  .title{
    flex:1 1 auto;min-width:0;font-size:15px;font-weight:800;letter-spacing:-0.3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
    color:#5C4030;
  }
  .title i{font-style:normal;color:#C4906E;font-weight:700;margin-right:4px;}
  .ico{
    flex:0 0 auto;width:34px;height:34px;border-radius:12px;border:2px solid #E0C7AB;
    background:#FFFBF2;display:flex;align-items:center;justify-content:center;padding:0;
    box-shadow:0 2px 0 #E4CDB3;color:#7A5B45;cursor:pointer;transition:transform .08s;
  }
  .ico:active{transform:translateY(2px);box-shadow:none;}
  .ico svg{width:19px;height:19px;display:block;}
  .row2{display:flex;align-items:center;justify-content:space-between;gap:8px;height:26px;margin-top:2px;padding:0 2px;}
  .prog{display:flex;align-items:center;gap:6px;}
  .prog .lbl{font-size:11px;font-weight:800;color:#A8836A;letter-spacing:-0.2px;}
  .dots{display:flex;gap:5px;}
  .dot{width:13px;height:13px;border-radius:50%;border:2px solid #DCC0A2;background:#FFFBF2;position:relative;transition:transform .18s;}
  .dot.on{background:#F2A0AE;border-color:#D9727F;transform:scale(1.06);}
  .dot.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#fff8;opacity:.85;}
  .hearts{display:flex;gap:3px;align-items:center;}
  .hearts svg{width:17px;height:17px;display:block;transition:transform .18s, opacity .25s;}
  .hearts svg.off{opacity:.22;transform:scale(.86);}
  .hearts svg.pop{transform:scale(1.3);}
  .hintBadge{font-size:11px;font-weight:800;color:#B98A5E;margin-left:2px;}

  /* ---------- 그림판 ---------- */
  #board{
    flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;touch-action:none;
  }
  #board.shake{animation:shake .32s cubic-bezier(.36,.07,.19,.97);}
  @keyframes shake{
    10%,90%{transform:translateX(-2px)}
    20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-6px)}
    40%,60%{transform:translateX(6px)}
  }
  .pic{
    position:relative;border-radius:14px;overflow:hidden;background:#fff;
    border:2.5px solid #fff;
    box-shadow:0 5px 0 rgba(150,114,82,.20), 0 3px 10px rgba(150,114,82,.16);
    flex:0 0 auto;
  }
  .pic canvas{display:block;width:100%;height:100%;}
  .pic .tag{
    position:absolute;left:7px;top:7px;font-size:10px;font-weight:800;letter-spacing:.4px;
    background:#FFFCEDE0;color:#9A7A5E;border-radius:8px;padding:1px 6px;line-height:15px;
    border:1.5px solid #EAD6BE;pointer-events:none;
  }
  .gap{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:100%;}
  .gap span{
    font-size:10px;font-weight:800;color:#B7987C;letter-spacing:1px;
    background:#FFF8ECE0;border:1.5px dashed #E4CDB0;border-radius:999px;padding:1px 10px;line-height:15px;
  }

  /* ---------- 하단 바 ---------- */
  #bar{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 2px 0;}
  .btn{
    font-family:inherit;font-weight:800;color:#5C4030;border:2px solid #D8B893;
    background:#FFFBF2;border-radius:14px;padding:0 14px;height:46px;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    box-shadow:0 3px 0 #E0C6A8;cursor:pointer;font-size:14px;letter-spacing:-0.3px;
    transition:transform .07s;
  }
  .btn svg{width:18px;height:18px;flex:0 0 auto;}
  .btn:active{transform:translateY(3px);box-shadow:none;}
  .btn.primary{
    background:linear-gradient(180deg,#FFD98F,#F7BE68);border-color:#C98F3F;color:#5A3714;
    box-shadow:0 4px 0 #C08A3C;
  }
  .btn.primary:active{box-shadow:none;}
  .btn.mint{background:linear-gradient(180deg,#CBEBD8,#A8D6BE);border-color:#7FB199;box-shadow:0 4px 0 #8CBBA1;color:#2F5947;}
  .btn.wide{flex:1 1 0;}
  .btn[disabled]{opacity:.45;box-shadow:0 3px 0 #E0C6A8;}
  #btnHint{flex:0 0 auto;}
  #btnReset{flex:1 1 0;}

  /* ---------- 화면(오버레이) ---------- */
  .screen{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);
    background:rgba(86,62,44,.34);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    opacity:1;transition:opacity .22s;
  }
  .screen.hidden{display:none;opacity:0;}
  .card{
    width:100%;max-width:352px;max-height:100%;overflow:auto;background:linear-gradient(180deg,#FFFCF4,#FDF2DF);
    border-radius:26px;border:3px solid #fff;
    box-shadow:0 10px 0 rgba(150,114,82,.18), 0 16px 40px rgba(120,90,60,.26);
    padding:22px 20px 20px;text-align:center;position:relative;
  }
  .card h1{margin:2px 0 6px;font-size:27px;letter-spacing:-1.2px;color:#5A3B28;}
  .card h2{margin:2px 0 4px;font-size:22px;letter-spacing:-.8px;color:#5A3B28;}
  .card p{margin:0 0 14px;font-size:13.5px;line-height:1.6;color:#8A6A52;font-weight:600;}
  .badge{
    display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;color:#A8794E;
    background:#FFF3DC;border:1.5px solid #EFD6B4;border-radius:999px;padding:3px 10px;margin-bottom:10px;
  }
  #peek{display:block;width:100%;height:auto;border-radius:16px;border:3px solid #fff;
    box-shadow:0 5px 0 rgba(150,114,82,.16),0 4px 14px rgba(150,114,82,.14);margin:0 0 16px;background:#EEE;}
  .card .btn{width:100%;height:50px;font-size:15px;margin-top:0;}
  .card .btn + .btn{margin-top:9px;}
  .chips{display:flex;gap:6px;margin-top:14px;justify-content:center;}
  .chip{
    flex:1 1 0;border:2px solid #E3CDB2;background:#FFFBF2;border-radius:13px;
    padding:6px 2px 5px;cursor:pointer;font-family:inherit;box-shadow:0 2px 0 #E6D0B5;transition:transform .07s;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .chip:active{transform:translateY(2px);box-shadow:none;}
  .chip b{font-size:15px;color:#7A5B45;line-height:1;}
  .chip em{font-style:normal;font-size:8.5px;font-weight:800;color:#B08F74;letter-spacing:-.2px;white-space:nowrap;}
  .chip.done b{color:#E08A6A;}
  .chip.now{border-color:#F0B76B;background:#FFF6E2;box-shadow:0 2px 0 #F0C994;}
  .stars{display:flex;justify-content:center;gap:8px;margin:2px 0 12px;}
  .stars svg{width:34px;height:34px;color:#FFD25E;filter:drop-shadow(0 2px 0 rgba(190,140,40,.35));}
  .stars svg.off{color:#E8D8C2;filter:none;}
  .stats{display:flex;justify-content:center;gap:10px;margin:0 0 16px;}
  .stats div{flex:1 1 0;background:#FFF6E6;border:2px solid #EFDBBE;border-radius:14px;padding:7px 4px;}
  .stats b{display:block;font-size:19px;color:#5A3B28;letter-spacing:-.5px;line-height:1.2;}
  .stats span{font-size:10.5px;font-weight:800;color:#B08F74;}
  .total{display:flex;justify-content:center;gap:8px;font-size:12px;font-weight:800;color:#8A6A52;margin:0 0 14px;}
  .total b{color:#C4784A;}
  .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:26px;}
  @keyframes fall{
    0%{transform:translateY(-10px) rotate(0deg);opacity:0;}
    12%{opacity:1;}
    100%{transform:translateY(340px) rotate(300deg);opacity:0;}
  }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="row1">
      <button id="btnBack" class="ico" aria-label="처음 화면">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="title" id="stageTitle"><i>1</i>토끼의 포근한 방</div>
      <button id="btnSound" class="ico" aria-label="소리 켜기/끄기">
        <svg id="icSound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L11.5 6v12L7.2 14.5H4z" fill="currentColor" stroke="none"/><path d="M15 9a4.2 4.2 0 0 1 0 6"/><path d="M17.6 6.4a8 8 0 0 1 0 11.2"/></svg>
      </button>
    </div>
    <div class="row2">
      <div class="prog">
        <span class="lbl">다른 곳</span>
        <div class="dots" id="dots"></div>
      </div>
      <div class="hearts" id="hearts"></div>
    </div>
  </header>

  <main id="board">
    <div class="pic" id="picA"><canvas id="cvA"></canvas><span class="tag">A</span></div>
    <div class="gap" id="gap"><span>서로 다른 곳 5</span></div>
    <div class="pic" id="picB"><canvas id="cvB"></canvas><span class="tag">B</span></div>
  </main>

  <footer id="bar">
    <button id="btnHint" class="btn" aria-label="힌트">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 17.5h5.6M10.3 20.5h3.4"/><path d="M12 3.2a6.3 6.3 0 0 0-3.6 11.5c.5.4.8 1 .8 1.6v.4h5.6v-.4c0-.7.3-1.2.8-1.6A6.3 6.3 0 0 0 12 3.2z"/></svg>
      <span>힌트 <b id="hintN">3</b></span>
    </button>
    <button id="btnReset" class="btn mint" aria-label="이 장면 다시">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 12a7.8 7.8 0 1 0 2.6-5.8"/><path d="M4 4.6v4.6h4.6"/></svg>
      <span>다시 찾기</span>
    </button>
  </footer>
</div>

<div class="screen" id="scrStart">
  <div class="card">
    <span class="badge">아기자기 일러스트 · 5장면</span>
    <h1>틀린그림찾기</h1>
    <p>위아래 그림에서 <b>서로 다른 곳 5개</b>를<br>찾아 콕 눌러 보세요</p>
    <canvas id="peek"></canvas>
    <button id="btnStart" class="btn primary">시작하기</button>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div class="screen hidden" id="scrModal">
  <div class="card" id="modalCard">
    <div class="confetti" id="confetti"></div>
    <div class="stars" id="mStars"></div>
    <h2 id="mTitle">참 잘했어요!</h2>
    <p id="mSub">다섯 곳을 모두 찾았어요</p>
    <div class="stats" id="mStats">
      <div><b id="mTime">0:42</b><span>걸린 시간</span></div>
      <div><b id="mMiss">0</b><span>틀린 횟수</span></div>
      <div><b id="mHint">0</b><span>힌트</span></div>
    </div>
    <div class="total" id="mTotal"></div>
    <button id="mMain" class="btn primary">다음 장면</button>
    <button id="mSub2" class="btn">다시 하기</button>
  </div>
</div>
<script>
/* =========================================================================
   틀린그림찾기 · 아기자기 다섯 장면
   그림은 모두 Canvas 벡터로 그립니다.
   A·B 두 장을 '같은 함수'로 그린 뒤, 차이점 5곳만 다르게 그리므로
   나머지 부분은 픽셀 단위로 완전히 같습니다.
   ========================================================================= */
'use strict';

var W = 390, H = 300;               // 그림 한 장의 논리 좌표
var VERSION = 'v1.0';

/* ---------- 작은 도우미 ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }

var INK = '#6B4F3A', INK2 = '#8A6A52';
var C = {
  cream:'#FFF8EB', paper:'#FBF0DC', white:'#FFFFFF', off:'#F7EDDD',
  peach:'#F9C9A8', peachD:'#E7A87C', blush:'#F7B0AE', rose:'#EE8FA6', pink:'#F8BCC8', pinkD:'#E28FA2',
  mint:'#C4E5D3', mintD:'#8FC9AE', teal:'#7CC0A5',
  butter:'#FBE4A6', sun:'#FBD37C', amber:'#EFAE5E', gold:'#F0C25E',
  sky:'#C6E6F4', skyD:'#9FD2E9', blue:'#9CC7E8', navy:'#33406B',
  lilac:'#DACBF0', purple:'#B79BD8',
  wood:'#E2BA8C', woodD:'#C89569', woodDD:'#A8784F', woodL:'#EFD0A8',
  brown:'#BE8A63', choco:'#8E6142', cocoa:'#6E4732',
  grass:'#B9DB92', grassD:'#96C572', leaf:'#8FC47A', leafD:'#6FA95C',
  red:'#E3675E', coral:'#EE8A6E', orange:'#F0A15C',
  grey:'#CFC6BC', slate:'#B7BFC8'
};

/* ---------- 도형 ---------- */
function rrPath(ctx,x,y,w,h,r){
  r = Math.min(r||0, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function paint(ctx,fill,stroke,lw){
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  if(stroke){ ctx.lineWidth = lw||1.6; ctx.strokeStyle = stroke; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke(); }
}
function box(ctx,x,y,w,h,r,fill,stroke,lw){ rrPath(ctx,x,y,w,h,r||0); paint(ctx,fill,stroke,lw); }
function circle(ctx,cx,cy,r,fill,stroke,lw){ ctx.beginPath(); ctx.arc(cx,cy,Math.max(0.1,r),0,6.2832); paint(ctx,fill,stroke,lw); }
function ell(ctx,cx,cy,rx,ry,rot,fill,stroke,lw){ ctx.beginPath(); ctx.ellipse(cx,cy,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,6.2832); paint(ctx,fill,stroke,lw); }
function poly(ctx,pts,fill,stroke,lw){
  ctx.beginPath();
  for(var i=0;i<pts.length;i++){ if(i) ctx.lineTo(pts[i][0],pts[i][1]); else ctx.moveTo(pts[i][0],pts[i][1]); }
  ctx.closePath(); paint(ctx,fill,stroke,lw);
}
function line(ctx,x1,y1,x2,y2,color,w,cap){
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.lineWidth = w||2; ctx.strokeStyle = color; ctx.lineCap = cap||'round'; ctx.stroke();
}
function curve(ctx,x1,y1,cx1,cy1,cx2,cy2,x2,y2,color,w){
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.bezierCurveTo(cx1,cy1,cx2,cy2,x2,y2);
  ctx.lineWidth = w||2; ctx.strokeStyle = color; ctx.lineCap='round'; ctx.stroke();
}
/* 두 점을 잇는 둥근 막대(팔·다리·막대기) */
function capsule(ctx,x1,y1,x2,y2,w,fill,stroke){
  var dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy)||1;
  var nx=-dy/len*(w/2), ny=dx/len*(w/2);
  ctx.beginPath();
  ctx.moveTo(x1+nx,y1+ny); ctx.lineTo(x2+nx,y2+ny);
  ctx.arc(x2,y2,w/2,Math.atan2(ny,nx),Math.atan2(-ny,-nx),false);
  ctx.lineTo(x1-nx,y1-ny);
  ctx.arc(x1,y1,w/2,Math.atan2(-ny,-nx),Math.atan2(ny,nx),false);
  ctx.closePath(); paint(ctx,fill,stroke);
}
function dot(ctx,cx,cy,r,color){ ctx.beginPath(); ctx.arc(cx,cy,r,0,6.2832); ctx.fillStyle=color; ctx.fill(); }

function starPath(ctx,cx,cy,ro,ri,points,rot){
  ctx.beginPath();
  for(var i=0;i<points*2;i++){
    var a = (rot||-Math.PI/2) + i*Math.PI/points;
    var r = i%2 ? ri : ro;
    var x = cx+Math.cos(a)*r, y = cy+Math.sin(a)*r;
    if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y);
  }
  ctx.closePath();
}
function star(ctx,cx,cy,ro,ri,points,fill,stroke,rot){ starPath(ctx,cx,cy,ro,ri,points||5,rot); paint(ctx,fill,stroke); }

function heartPath(ctx,cx,cy,s){
  ctx.beginPath();
  ctx.moveTo(cx,cy+s*0.72);
  ctx.bezierCurveTo(cx-s*1.18,cy-s*0.16, cx-s*0.56,cy-s*1.0, cx,cy-s*0.36);
  ctx.bezierCurveTo(cx+s*0.56,cy-s*1.0, cx+s*1.18,cy-s*0.16, cx,cy+s*0.72);
  ctx.closePath();
}
function heart(ctx,cx,cy,s,fill,stroke){ heartPath(ctx,cx,cy,s); paint(ctx,fill,stroke); }

function cloudShape(ctx,cx,cy,s,fill,stroke,lw){
  ctx.beginPath();
  ctx.arc(cx-s*0.62,cy+s*0.12,s*0.42,0,6.2832);
  ctx.arc(cx-s*0.02,cy-s*0.16,s*0.55,0,6.2832);
  ctx.arc(cx+s*0.64,cy+s*0.10,s*0.40,0,6.2832);
  ctx.rect(cx-s*0.62,cy+s*0.06,s*1.26,s*0.42);
  ctx.fillStyle=fill; ctx.fill();
  if(stroke){ ctx.lineWidth=lw||1.4; ctx.strokeStyle=stroke; ctx.stroke(); }
}

function sparklePath(ctx,cx,cy,r){
  ctx.beginPath();
  ctx.moveTo(cx,cy-r);
  ctx.quadraticCurveTo(cx+r*0.18,cy-r*0.18,cx+r,cy);
  ctx.quadraticCurveTo(cx+r*0.18,cy+r*0.18,cx,cy+r);
  ctx.quadraticCurveTo(cx-r*0.18,cy+r*0.18,cx-r,cy);
  ctx.quadraticCurveTo(cx-r*0.18,cy-r*0.18,cx,cy-r);
  ctx.closePath();
}
function sparkle(ctx,cx,cy,r,fill,alpha){
  ctx.save(); if(alpha!=null) ctx.globalAlpha=alpha;
  sparklePath(ctx,cx,cy,r); ctx.fillStyle=fill; ctx.fill(); ctx.restore();
}

/* ---------- 그림자 ---------- */
function groundShadow(ctx,cx,cy,rx,ry,alpha){
  ctx.save();
  var g = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry));
  g.addColorStop(0,'rgba(120,86,58,'+(alpha||0.16)+')');
  g.addColorStop(1,'rgba(120,86,58,0)');
  ctx.fillStyle=g;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(1,ry/rx); ctx.beginPath(); ctx.arc(0,0,rx,0,6.2832); ctx.fill(); ctx.restore();
  ctx.restore();
}

/* ---------- 공통 일러스트 조각 ---------- */
/* 벽지: 세로 줄무늬 */
function wallpaper(ctx,x,y,w,h,base,stripe){
  box(ctx,x,y,w,h,0,base);
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  for(var i=x+7;i<x+w;i+=26){ box(ctx,i,y,11,h,0,stripe); }
  ctx.restore();
}
/* 벽지: 동그라미 패턴 */
function wallpaperDots(ctx,x,y,w,h,base,dotColor,step){
  box(ctx,x,y,w,h,0,base);
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  var s = step||26;
  for(var yy=y; yy<y+h+s; yy+=s){
    for(var xx=x; xx<x+w+s; xx+=s){
      dot(ctx, xx + ((Math.round((yy-y)/s)%2)? s/2 : 0), yy, 2.6, dotColor);
    }
  }
  ctx.restore();
}
/* 마루 */
function floorPlanks(ctx,x,y,w,h,base,lineColor){
  box(ctx,x,y,w,h,0,base);
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  for(var yy=y+9; yy<y+h; yy+=17){ line(ctx,x,yy,x+w,yy,lineColor,1.2); }
  for(var i=0;i<5;i++){
    var xx = x + 18 + i*82 + (i%2?26:0);
    line(ctx,xx,y,xx-8,y+h,lineColor,1.1);
  }
  ctx.restore();
}
/* 타일 바닥(체크) */
function floorTiles(ctx,x,y,w,h,c1,c2,tile){
  box(ctx,x,y,w,h,0,c1);
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  var t = tile||26;
  for(var r=0; r*t < h+t; r++){
    for(var c=0; c*t < w+t; c++){
      if((r+c)%2===0) box(ctx, x+c*t, y+r*t, t, t, 0, c2);
    }
  }
  ctx.restore();
}
/* 걸레받이 */

/* 창문 (틀 + 유리 + 창틀대) */
function windowBox(ctx,x,y,w,h,skyFill,frameFill,opts){
  opts = opts||{};
  box(ctx,x-3,y-3,w+6,h+6,6,frameFill||'#FFFDF6','#D8BC9C',1.6);
  box(ctx,x,y,w,h,3,skyFill,'#CBAD90',1.2);
  // 창틀
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  if(opts.sky!==false){ wallSky(ctx,x,y,w,h,skyFill); }
  ctx.restore();
  var mw = opts.mullion||3;
  box(ctx,x+w/2-mw/2,y,mw,h,0,frameFill||'#FFFDF6');
  box(ctx,x,y+h*0.42,w,mw,0,frameFill||'#FFFDF6');

function wallSky(ctx,x,y,w,h){

  g.addColorStop(0,'#BCE1F2'); g.addColorStop(1,'#E6F4FA');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);

/* 커튼(양쪽) */
function curtains(ctx,x,y,w,h,color,dark,gather){
  var cw = w*0.20;
  [0,1].forEach(function(side){
    var bx = side ? x+w-cw : x;
    ctx.beginPath();
    ctx.moveTo(bx, y-4);
    ctx.lineTo(bx+cw, y-4);
    ctx.quadraticCurveTo(bx+cw*(side?0.72:1.28), y+h*0.55, bx+cw*(side?0.95:0.05), y+h);
    ctx.lineTo(bx, y+h);
    ctx.closePath();
    paint(ctx,color,dark,1.4);
    for(var i=1;i<gather.length+1;i++){
      var t = i/(gather.length+1);
      var px = bx + cw*t*(side?1:1);
      line(ctx,px,y+2,px+(side?-1:1)*2,y+h-1,'rgba(255,255,255,.45)',1.6);
    }
  });
  // 커튼봉
  capsule(ctx,x-8,y-8,x+w+8,y-8,5,'#E6C8A4','#CBAB86');
  [x-8,x+w+8].forEach(function(px){ circle(ctx,px,y-8,3.4,'#E0C09C','#C9A781',1.2); });
}
/* 액자 */
function frame(ctx,x,y,w,h,border,fill,mat){

  box(ctx,x+3,y+3,w-6,h-6,2,mat||'#FFF9EC');
  ctx.save(); ctx.beginPath(); ctx.rect(x+3,y+3,w-6,h-6); ctx.clip();
  if(fill) fill(ctx,x+3,y+3,w-6,h-6);
  ctx.restore();
}
/* 화분 속 식물 */
function pottedPlant(ctx,x,y,s,potColor,leafColor,variant){
  var pw = 15*s, ph = 13*s;
  groundShadow(ctx,x,y+ph+1,pw*0.9,pw*0.36,.14);
  // 잎
  var baseY = y;
  var dirs = [-1,-0.55,0,0.55,1];
  for(var i=0;i<dirs.length;i++){
    var a = -Math.PI/2 + dirs[i]*0.62;
    var len = (22 + (i%2? 6:0))*s;
    var lx = x + Math.cos(a)*len, ly = baseY + Math.sin(a)*len;
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.quadraticCurveTo(x + Math.cos(a)*len*0.42 + 7*s, baseY + Math.sin(a)*len*0.6, lx, ly);
    ctx.quadraticCurveTo(x + Math.cos(a)*len*0.5 - 6*s, baseY + Math.sin(a)*len*0.55 + 3*s, x, baseY);
    ctx.closePath();
    paint(ctx, i%2? leafColor||C.leaf : (C.leafD||'#7FB268'), null);
  }
  if(variant==='flower'){
    for(var f=0;f<3;f++){ flower(ctx, x + (f-1)*9*s, baseY-24*s + (f===1?-4*s:0), 3.6*s, C.pink, C.butter); }
  }
  rrPath(ctx, x-pw/2, y, pw, ph, 3*s);
  paint(ctx, potColor||'#E3A98B', '#C08A6C', 1.4);
  box(ctx, x-pw/2-1.5, y-1, pw+3, 4.5*s, 1.6, potColor||'#E3A98B', '#C08A6C', 1.3);
}
/* 꽃 한 송이 */
function flower(ctx,x,y,r,petal,core,petals){
  var n = petals||5;
  for(var i=0;i<n;i++){
    var a = i*6.2832/n;
    circle(ctx, x+Math.cos(a)*r*0.85, y+Math.sin(a)*r*0.85, r*0.72, petal);
  }
  circle(ctx,x,y,r*0.62,core||C.butter);
}
/* 작은 나뭇잎 */
function leafShape(ctx,x,y,len,wid,rot,fill,stroke){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.quadraticCurveTo(len*0.42,-wid, len,0);
  ctx.quadraticCurveTo(len*0.42, wid, 0,0);
  ctx.closePath(); paint(ctx,fill,stroke);
  ctx.restore();
}

  ctx.fillStyle=g; ctx.fillRect(0,y,W,h);

/* 천장 걸이 전구 줄 */
function stringLights(ctx,x1,y1,x2,y2,sag,bulbs,on){
  ctx.beginPath(); ctx.moveTo(x1,y1);
  ctx.quadraticCurveTo((x1+x2)/2, (y1+y2)/2 + sag, x2,y2);
  ctx.strokeStyle='#8C7A62'; ctx.lineWidth=1.1; ctx.stroke();
  for(var i=1;i<=bulbs;i++){
    var t=i/(bulbs+1);
    var bx = lerp(x1,x2,t), by = lerp(y1,y2,t) + sag*2*t*(1-t);
    line(ctx,bx,by,bx,by+4,'#8C7A62',1);
    if(on){
      ctx.save();
      var g2 = ctx.createRadialGradient(bx,by+8,0,bx,by+8,10);
      g2.addColorStop(0,'rgba(255,219,140,.85)'); g2.addColorStop(1,'rgba(255,219,140,0)');
      ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(bx,by+8,10,0,6.2832); ctx.fill(); ctx.restore();
    }
    ell(ctx,bx,by+7,3.4,4.2,0, on?'#FFE39B':'#EFE1C6', '#C9AF88', 1);
  }
}

  set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
var SKEY = { stars:'sd.stars', mute:'sd.mute', last:'sd.last' };
var muted = LS.get(SKEY.mute,'0') === '1';
var starMap = {};
try{ starMap = JSON.parse(LS.get(SKEY.stars,'{}')) || {}; }catch(e){ starMap = {}; }

var $ = function(id){ return document.getElementById(id); };
var picA = $('picA'), picB = $('picB'), cvA = $('cvA'), cvB = $('cvB');
var ctxA = cvA.getContext('2d'), ctxB = cvB.getContext('2d');
var boardEl = $('board'), gapEl = $('gap');

var DPR = Math.min(3, Math.max(1, window.devicePixelRatio || 1));

var G = {
  stage: 0, found: [], hearts: 5, hints: 3, hintsUsed: 0, mistakes: 0,
  t0: 0, running: false, done: false, over: false,
  markers: [], fx: [], hintRing: null, shakeT: 0
};

var cacheA = null, cacheB = null, cacheStage = -1, cacheW = 0, cacheH = 0;

/* ---------- 장면 그리기 ---------- */
function drawSceneInto(ctx, idx, alt, pxW, pxH){
  ctx.save();
  ctx.setTransform(pxW/W, 0, 0, pxW/W, 0, 0);
  ctx.clearRect(0, 0, W, H);
  try{ STAGES[idx].draw(ctx, !!alt); }
  catch(err){ if(window.console) console.error('scene draw error', idx, err); }
  /* 공통 마무리: 따뜻한 비네트 (양쪽 동일) */
  var vg = ctx.createRadialGradient(W/2, H*0.42, H*0.25, W/2, H*0.5, H*0.95);
  vg.addColorStop(0,'rgba(255,240,210,0)');
  vg.addColorStop(1,'rgba(120,86,52,.10)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function buildCache(){
  var key = G.stage + ':' + cacheW + 'x' + cacheH;
  if(cacheStage === G.stage && cacheA && cacheA.width === cacheW && cacheA.height === cacheH) return;
  cacheA = document.createElement('canvas'); cacheA.width = cacheW; cacheA.height = cacheH;
  cacheB = document.createElement('canvas'); cacheB.width = cacheW; cacheB.height = cacheH;
  drawSceneInto(cacheA.getContext('2d'), G.stage, false, cacheW, cacheH);
  drawSceneInto(cacheB.getContext('2d'), G.stage, true,  cacheW, cacheH);
  cacheStage = G.stage;
}

/* ---------- 배치 ---------- */
var LAY = { w:0, h:0, gap:0 };
function layout(){
  var availW = boardEl.clientWidth || 370;
  var availH = boardEl.clientHeight || 560;
  var gap = availH > 640 ? 26 : 20;
  var ph = Math.min((availH - gap) / 2, availW * H / W);
  var pw = ph * W / H;
  if(pw > availW){ pw = availW; ph = pw * H / W; }
  pw = Math.floor(pw); ph = Math.floor(ph);
  picA.style.width = pw + 'px'; picA.style.height = ph + 'px';
  picB.style.width = pw + 'px'; picB.style.height = ph + 'px';
  gapEl.style.height = gap + 'px';
  var cw = Math.round(pw * DPR), ch = Math.round(ph * DPR);
  [cvA, cvB].forEach(function(cv){
    if(cv.width !== cw || cv.height !== ch){ cv.width = cw; cv.height = ch; }
  });
  cacheW = cvA.width; cacheH = cvA.height;
  cacheStage = -1;
  LAY = { w:pw, h:ph, gap:gap };
  buildCache();
  drawFrameAll();
}

/* ---------- 그리기(프레임) ---------- */
var animating = false;
function drawFrameAll(){
  drawPic(ctxA, cvA, cacheA, 0);
  drawPic(ctxB, cvB, cacheB, 1);
}
function drawPic(ctx, cv, cache, which){
  var pxW = cv.width, pxH = cv.height;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,pxW,pxH);
  if(cache) ctx.drawImage(cache, 0, 0, pxW, pxH);
  ctx.setTransform(pxW/W, 0, 0, pxW/W, 0, 0);
  var now = performance.now();

  /* 찾은 곳 표시 */
  G.markers.forEach(function(m){
    var age = now - m.t;
    var pop = m.pop ? clamp(age/320, 0, 1) : 1;
    var sc = 1 + (1-easeOutBack(pop)) * 0.0; // 부드럽게 커지기
    var grow = m.pop ? (0.55 + 0.45*easeOutBack(pop)) : 1;
    ctx.save();
    ctx.globalAlpha = m.pop ? clamp(age/90,0,1) : 1;
    var r = m.r * grow;
    // 반짝 파티클
    if(m.pop && age < 620){
      var t = age/620;
      for(var i=0;i<5;i++){
        var a = i*1.2566 + m.seed;
        var d = r*1.15 + t*26;
        var al = (1-t)*0.95;
        sparkle(ctx, m.x+Math.cos(a)*d, m.y+Math.sin(a)*d, 4.2*(1-t*0.5), '#FFF6C8', al);
      }
    }
    ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, 6.2832);
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 4.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, 6.2832);
    ctx.strokeStyle = '#F2705F'; ctx.lineWidth = 2.6; ctx.stroke();
    // 작은 체크
    if(!m.pop || age > 240){
      ctx.beginPath();
      ctx.moveTo(m.x - r*0.34, m.y + r*0.04);
      ctx.lineTo(m.x - r*0.06, m.y + r*0.34);
      ctx.lineTo(m.x + r*0.42, m.y - r*0.30);
      ctx.strokeStyle = '#FFF8E8'; ctx.lineWidth = 2.4; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(m.x - r*0.34, m.y + r*0.04);
      ctx.lineTo(m.x - r*0.06, m.y + r*0.34);
      ctx.lineTo(m.x + r*0.42, m.y - r*0.30);
      ctx.strokeStyle = '#E0553F'; ctx.lineWidth = 1.2; ctx.stroke();
    }
    ctx.restore();
  });

  /* 힌트 링 */
  if(G.hintRing){
    var hr = G.hintRing, age2 = now - hr.t;
    if(age2 < hr.dur){
      var pulse = 0.5 + 0.5*Math.sin(age2/180);
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.4*pulse;
      ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.arc(hr.x, hr.y, hr.r*(1.05+0.12*pulse), 0, 6.2832);
      ctx.strokeStyle = '#FFF3B0'; ctx.lineWidth = 3.4; ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(hr.x, hr.y, hr.r*(1.05+0.12*pulse), 0, 6.2832);
      ctx.strokeStyle = 'rgba(240,170,60,.75)'; ctx.lineWidth = 1.4; ctx.stroke();
      for(var k=0;k<3;k++){
        var a2 = age2/300 + k*2.09;
        sparkle(ctx, hr.x+Math.cos(a2)*hr.r*1.3, hr.y+Math.sin(a2)*hr.r*0.9, 5.2, '#FFF6C8', 0.9);
      }
      ctx.restore();
    } else {
      G.hintRing = null;
    }
  }

  /* 오답 X */
  G.fx.forEach(function(f){
    var age3 = now - f.t;
    if(age3 > 620) return;
    var t2 = age3/620;
    ctx.save();
    ctx.globalAlpha = (1-t2)*0.95;
    var s = 10 + 4*t2;
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(f.x-s,f.y-s); ctx.lineTo(f.x+s,f.y+s);
    ctx.strokeStyle='#FFF8EC'; ctx.lineWidth=6; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(f.x+s,f.y-s); ctx.lineTo(f.x-s,f.y+s);
    ctx.strokeStyle='#FFF8EC'; ctx.lineWidth=6; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(f.x-s,f.y-s); ctx.lineTo(f.x+s,f.y+s);
    ctx.strokeStyle='#D9503C'; ctx.lineWidth=3.4; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(f.x+s,f.y-s); ctx.lineTo(f.x-s,f.y+s);
    ctx.strokeStyle='#D9503C'; ctx.lineWidth=3.4; ctx.stroke();
    ctx.restore();
  });
}
function easeOutBack(t){ var c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }

var rafId = null;
function tick(){
  drawFrameAll();
  var now = performance.now();
  var live = false;
  if(G.markers.some(function(m){ return m.pop && now - m.t < 640; })) live = true;
  if(G.fx.some(function(f){ return now - f.t < 640; })) live = true;
  if(G.hintRing && now - G.hintRing.t < G.hintRing.dur) live = true;
  if(now - G.shakeT < 340) live = true;
  if(G.over && G.overT && now - G.overT < 900) live = true;
  if(live) rafId = requestAnimationFrame(tick);
  else rafId = null;
}
function requestDraw(){
  if(rafId == null) rafId = requestAnimationFrame(tick);
}

/* ---------- HUD ---------- */
var HEART_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.6S4.2 15.9 4.2 10.7A4.65 4.65 0 0 1 12 7.2a4.65 4.65 0 0 1 7.8 3.5c0 5.2-7.8 9.9-7.8 9.9z"/></svg>';
var STAR_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.4l2.86 6.03 6.64.9-4.85 4.6 1.2 6.6L12 17.4l-5.85 3.13 1.2-6.6L2.5 9.33l6.64-.9z"/></svg>';

function buildHUD(){
  var dots = $('dots'); dots.innerHTML = '';
  for(var i=0;i<5;i++){
    var d = document.createElement('span');
    d.className = 'dot' + (G.found.indexOf(i) >= 0 ? ' on' : '');
    dots.appendChild(d);
  }
  var hs = $('hearts'); hs.innerHTML = '';
  for(var j=0;j<5;j++){
    var s = document.createElement('span');
    s.innerHTML = HEART_SVG;
    s.style.display = 'flex';
    s.className = '';
    if(j >= G.hearts){
      var svg = s.firstChild;
      svg.setAttribute('class','off');
      svg.style.color = '#D9C4AE';
    } else {
      s.firstChild.style.color = '#F0808F';
    }
    hs.appendChild(s);
  }
  $('hintN').textContent = String(G.hints);
  var b = $('btnHint');
  if(G.hints <= 0) b.setAttribute('disabled',''); else b.removeAttribute('disabled');
  var st = STAGES[G.stage];
  $('stageTitle').innerHTML = '<i>' + (G.stage+1) + '</i>' + st.name;
  $('btnSound').innerHTML = muted ? MUTE_SVG : SOUND_SVG;
}
var SOUND_SVG = '<svg id="icSound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L11.5 6v12L7.2 14.5H4z" fill="currentColor" stroke="none"/><path d="M15 9a4.2 4.2 0 0 1 0 6"/><path d="M17.6 6.4a8 8 0 0 1 0 11.2"/></svg>';
var MUTE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L11.5 6v12L7.2 14.5H4z" fill="currentColor" stroke="none"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>';

/* ---------- 게임 흐름 ---------- */
function startStage(idx){
  G.stage = clamp(idx, 0, STAGES.length-1);
  G.found = []; G.hearts = 5; G.hints = 3; G.hintsUsed = 0; G.mistakes = 0;
  G.markers = []; G.fx = []; G.hintRing = null; G.running = true; G.done = false; G.over = false; G.overT = 0;
  G.t0 = performance.now();
  cacheStage = -1;
  layout();
  buildHUD();
  hideScreens();
  LS.set(SKEY.last, String(G.stage));
  requestDraw();
}
function currentDiff(i){ return STAGES[G.stage].diffs[i]; }

function handleTap(clientX, clientY){
  if(!G.running || G.done || G.over) return;
  if(!$('scrModal').classList.contains('hidden')) return;
  if(!$('scrStart').classList.contains('hidden')) return;
  var rectA_ = picA.getBoundingClientRect();
  var rectB_ = picB.getBoundingClientRect();
  var rect = null;
  if(clientX >= rectA_.left && clientX <= rectA_.right && clientY >= rectA_.top && clientY <= rectA_.top + rectA_.height) rect = rectA_;
  else if(clientX >= rectB_.left && clientX <= rectB_.right && clientY >= rectB_.top && clientY <= rectB_.top + rectB_.height) rect = rectB_;
  if(!rect) return;
  var lx = (clientX - rect.left) / rect.width * W;
  var ly = (clientY - rect.top) / rect.height * H;
  judge(lx, ly);
}

function judge(lx, ly){
  var best = -1, bestD = 1e9;
  var diffs = STAGES[G.stage].diffs;
  for(var i=0;i<diffs.length;i++){
    if(G.found.indexOf(i) >= 0) continue;
    var d = diffs[i];
    var dist = Math.sqrt((lx-d.x)*(lx-d.x) + (ly-d.y)*(ly-d.y));
    if(dist <= Math.max(d.r, 24) && dist < bestD){ bestD = dist; best = i; }
  }
  if(best >= 0){
    foundDiff(best);
  } else {
    var already = -1;
    for(var j=0;j<diffs.length;j++){
      if(G.found.indexOf(j) < 0) continue;
      var dj = diffs[j];
      if(Math.hypot(lx-dj.x, ly-dj.y) <= dj.r*1.05){ already = j; break; }
    }
    if(already >= 0) return;   // 이미 찾은 곳을 다시 누른 경우 – 벌점 없음
    wrongTap(lx, ly);
  }
}

function foundDiff(i){
  G.found.push(i);
  var d = currentDiff(i);
  var now = performance.now();
  G.markers.push({ x:d.x, y:d.y, r:Math.max(20, d.r*0.86), t:now, pop:true, seed:Math.random()*6.28 });
  sfxFound();
  buildHUD();
  requestDraw();
  if(G.found.length >= STAGES[G.stage].diffs.length) {
    setTimeout(stageClear, 520);
  }
}
function wrongTap(lx, ly){
  G.hearts--; G.mistakes++;
  sfxWrong();
  G.fx.push({ x:lx, y:ly, t:performance.now() });
  G.shakeT = performance.now();
  boardEl.classList.remove('shake');
  void boardEl.offsetWidth;
  boardEl.classList.add('shake');
  setTimeout(function(){ boardEl.classList.remove('shake'); }, 360);
  buildHUD();
  requestDraw();
  if(G.hearts <= 0){ G.over = true; G.overT = performance.now(); setTimeout(showGameOver, 420); }
}

function useHint(){
  if(!G.running || G.done || G.over || G.hints <= 0) return;
  var left = [];
  STAGES[G.stage].diffs.forEach(function(d,i){ if(G.found.indexOf(i) < 0) left.push(i); });
  if(!left.length) return;
  var pick = left[Math.floor(Math.random()*left.length)];
  var d = STAGES[G.stage].diffs[pick];
  G.hints--; G.hintsUsed++;
  G.hintRing = { x:d.x, y:d.y, r:Math.max(24, d.r), t:performance.now(), dur:2800 };
  sfxHint();
  buildHUD();
  requestDraw();
}

function stageClear(){
  if(G.done) return;
  G.done = true;
  var secs = Math.max(1, Math.round((performance.now() - G.t0)/1000));
  var st = starsFor();
  var key = STAGES[G.stage].key;
  if(!starMap[key] || starMap[key] < st){ starMap[key] = st; LS.set(SKEY.stars, JSON.stringify(starMap)); }
  var allDone = STAGES.every(function(s){ return starMap[s.key] > 0; });
  sfxStageClear();
  showClearModal(secs, st, allDone);
}

function starsFor(){
  if(G.mistakes === 0 && G.hintsUsed === 0) return 3;
  if(G.mistakes <= 2 && G.hintsUsed <= 1) return 2;
  return 1;
}
function fmtTime(s){
  var mm = Math.floor(s/60), ss = s%60;
  return mm + ':' + (ss<10?'0':'') + ss;
}

/* ---------- 화면 ---------- */
function hideScreens(){
  $('scrStart').classList.add('hidden');
  $('scrModal').classList.add('hidden');
}
function showStart(){
  G.running = false;
  $('scrStart').classList.remove('hidden');
  $('scrModal').classList.add('hidden');
  buildChips();
  drawPeek();
}
function buildChips(){
  var wrap = $('chips'); wrap.innerHTML = '';
  STAGES.forEach(function(s,i){
    var b = document.createElement('button');
    b.className = 'chip' + (starMap[s.key] ? ' done' : '') + (i === G.stage ? ' now' : '');
    b.innerHTML = '<b>' + (starMap[s.key] ? '★' + starMap[s.key] : (i+1)) + '</b><em>' + s.name.split(' ')[0] + '</em>';
    b.addEventListener('click', function(){ unlockAudio(); sfxTap(); startStage(i); });
    wrap.appendChild(b);
  });
}
function drawPeek(){
  var cv = $('peek');
  var w = 306, h = Math.round(w * H / W);
  cv.style.height = h + 'px';
  cv.width = w * DPR; cv.height = h * DPR;
  var c = cv.getContext('2d');
  var idx = G.stage % STAGES.length;
  drawSceneInto(c, idx, false, cv.width, cv.height);
}

var modalMode = 'clear';
function showClearModal(secs, st, allDone){
  modalMode = allDone ? 'all' : 'clear';
  var el = $('scrModal');
  $('mStars').style.display = '';
  $('mStats').style.display = '';
  $('mTotal').style.display = 'none';
  var html = '';
  for(var i=0;i<3;i++) html += STAR_SVG.replace('<svg ', '<svg class="' + (i<st?'':'off') + '" ');
  $('mStars').innerHTML = html;
  [0,1,2].forEach(function(i){
    if(i<st){ setTimeout(function(){ sfxStar(i); }, 260 + i*180); }
  });
  $('mTime').textContent = fmtTime(secs);
  $('mMiss').textContent = String(G.mistakes);
  $('mHint').textContent = String(G.hintsUsed);
  if(allDone){
    $('mTitle').textContent = '다섯 장면 모두 완성!';
    $('mSub').innerHTML = '아기자기한 그림을 모두 찾았어요.<br>정말 대단해요!';
    $('mMain').textContent = '처음부터 다시';
    $('mSub2').textContent = '장면 고르기';
    var total = 0; STAGES.forEach(function(s){ total += (starMap[s.key]||0); });
    $('mTotal').style.display = 'flex';
    $('mTotal').innerHTML = '모은 별 <b>' + total + ' / 15</b>';
    sfxAllClear();
    confetti();
  } else {
    $('mTitle').textContent = st===3 ? '완벽해요!' : '참 잘했어요!';
    $('mSub').innerHTML = '이 장면의 다른 곳 <b>5곳</b>을 모두 찾았어요';
    $('mMain').textContent = G.stage < STAGES.length-1 ? '다음 장면' : '처음 화면';
    $('mSub2').textContent = '이 장면 다시';
    confetti();
  }
  el.classList.remove('hidden');
}
function showGameOver(){
  modalMode = 'over';
  $('mStars').style.display = 'none';
  $('mStats').style.display = 'none';
  $('mTotal').style.display = 'none';
  $('mTitle').textContent = '하트를 다 썼어요';
  $('mSub').innerHTML = '서로 다른 곳 <b>' + (5 - G.found.length) + '곳</b>이 남았어요.<br>천천히 다시 찾아볼까요?';
  $('mMain').textContent = '다시 도전하기';
  $('mSub2').textContent = '장면 고르기';
  sfxLose();
  $('scrModal').classList.remove('hidden');
}
function confetti(){
  var wrap = $('confetti');
  wrap.innerHTML = '';
  var cols = ['#F6B3C0','#FBE3A4','#BFE3CF','#C4E4F3','#DACBF0','#F7A98A'];
  for(var i=0;i<16;i++){
    var s = document.createElement('i');
    var w = 5 + Math.random()*6, h = 7 + Math.random()*7;
    s.style.cssText = 'position:absolute;top:-14px;left:' + (Math.random()*100) + '%;width:' + w + 'px;height:' + h + 'px;' +
      'background:' + cols[i%cols.length] + ';border-radius:' + (i%3? '2px':'50%') + ';opacity:.95;' +
      'animation:fall ' + (1.5 + Math.random()*1.3) + 's ' + (Math.random()*0.5) + 's ease-in forwards;';
    wrap.appendChild(s);
  }
}

/* ---------- 이벤트 ---------- */
boardEl.addEventListener('pointerdown', function(e){
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  unlockAudio();
  handleTap(e.clientX, e.clientY);
}, {passive:true});

$('btnStart').addEventListener('click', function(){
  unlockAudio(); sfxTap();
  var last = parseInt(LS.get(SKEY.last,'0'),10) || 0;
  var firstUnfinished = STAGES.findIndex(function(s){ return !starMap[s.key]; });
  startStage(firstUnfinished >= 0 ? firstUnfinished : last);
});
$('btnHint').addEventListener('click', function(){ unlockAudio(); useHint(); });
$('btnReset').addEventListener('click', function(){ unlockAudio(); sfxTap(); startStage(G.stage); });
$('btnBack').addEventListener('click', function(){ unlockAudio(); sfxTap(); showStart(); });
$('btnSound').addEventListener('click', function(){
  muted = !muted;
  LS.set(SKEY.mute, muted ? '1' : '0');
  if(muted){ bgmStop(); } else { unlockAudio(); bgmStart(); sfxTap(); }
  buildHUD();
});
$('mMain').addEventListener('click', function(){
  unlockAudio(); sfxTap();
  $('scrModal').classList.add('hidden');
  if(modalMode === 'over'){ startStage(G.stage); return; }
  if(modalMode === 'all'){ startStage(0); return; }
  if(G.stage < STAGES.length-1) startStage(G.stage + 1); else showStart();
});
$('mSub2').addEventListener('click', function(){
  unlockAudio(); sfxTap();
  $('scrModal').classList.add('hidden');
  if(modalMode === 'over' || modalMode === 'all'){ showStart(); return; }
  startStage(G.stage);
});
window.addEventListener('resize', function(){
  if($('scrStart').classList.contains('hidden')) { layout(); }
  else drawPeek();
});

/* ---------- 검증용 훅 ---------- */
window.__sd = {
  version: VERSION,
  stages: STAGES.map(function(s){ return { key:s.key, name:s.name, diffs:s.diffs.map(function(d){ return [d.x,d.y,d.r,d.label]; }) }; }),
  state: function(){
    return { stage:G.stage, found:G.found.slice(), hearts:G.hearts, hints:G.hints,
             mistakes:G.mistakes, running:G.running, done:G.done, over:G.over,
             total:STAGES[G.stage].diffs.length };
  },
  layoutInfo: function(){ return { picW:LAY.w, picH:LAY.h, cvW:cvA.width, cvH:cvA.height, dpr:DPR }; },
  tapLogical: function(lx, ly){ judge(lx, ly); },
  tapScreen: function(lx, ly, which){
    var rect = (which === 1 ? picB : picA).getBoundingClientRect();
    var cx = rect.left + lx / W * rect.width;
    var cy = rect.top + ly / H * rect.height;
    handleTap(cx, cy);
    return { cx:cx, cy:cy };
  },
  diffAt: function(i){ var d = STAGES[G.stage].diffs[i]; return { x:d.x, y:d.y, r:d.r, label:d.label }; },
  goto: function(i){ startStage(i); },
  hint: function(){ useHint(); },
  setElapsed: function(sec){ G.t0 = performance.now() - sec*1000; },
  reset: function(){ startStage(G.stage); },
  audio: function(){
    return { ctx: actx ? actx.state : 'none', session: (function(){ try{ return navigator.audioSession ? navigator.audioSession.type : 'none'; }catch(e){ return 'err'; } })(),
             muted: muted, bgm: !!bgmTimer, keepAlive: !!(keepAliveEl && !keepAliveEl.paused) };
  },
  unlock: function(){ unlockAudio(); },
  /* 두 그림의 픽셀 차이를 묶음(cluster)으로 세어 준다 */
  buildMask: function(idx){
    var i = (idx==null) ? G.stage : idx;
    var cw = 780, ch = Math.round(cw*H/W);
    var a = document.createElement('canvas'); a.width=cw; a.height=ch;
    var b = document.createElement('canvas'); b.width=cw; b.height=ch;
    drawSceneInto(a.getContext('2d'), i, false, cw, ch);
    drawSceneInto(b.getContext('2d'), i, true, cw, ch);
    var da = a.getContext('2d').getImageData(0,0,cw,ch).data;
    var db = b.getContext('2d').getImageData(0,0,cw,ch).data;
    var mask = new Uint8Array(cw*ch);
    var n = 0;
    for(var p=0;p<cw*ch;p++){
      var o=p*4;
      if(Math.abs(da[o]-db[o]) + Math.abs(da[o+1]-db[o+1]) + Math.abs(da[o+2]-db[o+2]) > 24){ mask[p]=1; n++; }
    }
    return { cw:cw, ch:ch, mask:mask, total:n };
  },
  /* 각 차이점 반경 안에 실제로 다른 픽셀이 몇 개 있는지 */
  diffReport: function(idx){
    var i = (idx==null) ? G.stage : idx;
    var m = window.__sd.buildMask(i);
    var sx = m.cw / W, sy = m.ch / H;
    var diffs = STAGES[i].diffs;
    var out = diffs.map(function(d){
      var cnt = 0, minx=1e9, maxx=-1, miny=1e9, maxy=-1;
      var rp = d.r * sx;
      var x0=Math.max(0,Math.floor((d.x*W/W)*sx - rp)), x1=Math.min(m.cw-1,Math.ceil(d.x*sx + rp));
      var y0=Math.max(0,Math.floor(d.y*sy - rp)), y1=Math.min(m.ch-1,Math.ceil(d.y*sy + rp));
      for(var yy=y0; yy<=y1; yy++) for(var xx=x0; xx<=x1; xx++){
        var lx = xx/sx, ly = yy/sy;
        if((lx-d.x)*(lx-d.x)+(ly-d.y)*(ly-d.y) > d.r*d.r) continue;
        if(m.mask[yy*m.cw+xx]){ cnt++; if(xx<minx)minx=xx; if(xx>maxx)maxx=xx; if(yy<miny)miny=yy; if(yy>maxy)maxy=yy; }
      }
      return { label:d.label, x:d.x, y:d.y, r:d.r, inRadius:cnt,
               bx: maxx<0? null : Math.round((minx+maxx)/2/sx), by: maxx<0? null : Math.round((miny+maxy)/2/sy) };
    });
    return { total:m.total, diffs:out };
  },
  pixelClusters: function(idx){
    var i = (idx==null) ? G.stage : idx;
    var m = window.__sd.buildMask(i);
    var cw = m.cw, ch = m.ch, mask = m.mask, n = m.total;
    // 8-이웃 연결 요소
    var seen = new Uint8Array(cw*ch), clusters = [];
    for(var p2=0;p2<cw*ch;p2++){
      if(!mask[p2] || seen[p2]) continue;
      var stack=[p2], cnt=0, minx=1e9, maxx=-1, miny=1e9, maxy=-1;
      seen[p2]=1;
      while(stack.length){
        var q=stack.pop(); cnt++;
        var qx=q%cw, qy=(q-qx)/cw;
        if(qx<minx)minx=qx; if(qx>maxx)maxx=qx; if(qy<miny)miny=qy; if(qy>maxy)maxy=qy;
        for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){
          var nx=qx+dx, ny=qy+dy;
          if(nx<0||ny<0||nx>=cw||ny>=ch) continue;
          var np=ny*cw+nx;
          if(mask[np] && !seen[np]){ seen[np]=1; stack.push(np); }
        }
      }
      if(cnt > 18) clusters.push({ px:cnt, x:(minx+(maxx-minx)/2)/cw*W, y:(miny+(maxy-miny)/2)/ch*H, w:(maxx-minx)/cw*W, h:(maxy-miny)/ch*H });
    }
    clusters.sort(function(x,y){ return y.px-x.px; });
    return { total:n, clusters:clusters.slice(0,12), count:clusters.length };
  }
};
</script>
