      if (inflight) return inflight;
      state = 'loading';
      render();
      inflight = fetch(DB + '.json', { cache: 'no-store' })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(json => {
          rows = normalize(json);
          state = 'ok';
          lastAt = Date.now();
          inflight = null;
          render();
          return rows;
        })
        .catch(() => {
          rows = sortRows(readLocal()).slice(0, LIMIT);
          state = 'offline';
          lastAt = Date.now();
          inflight = null;
          render();
          return rows;
        });
      return inflight;
    }

    function submit(name, height, score) {
      const nm = cleanName(name);
      if (!nm) return Promise.resolve({ ok: false, msg: '닉네임을 먼저 입력해 주세요' });
      const h = Math.max(0, Math.round(Number(height) || 0));
      if (h < 1) return Promise.resolve({ ok: false, msg: '1m 이상 올라가야 등록돼요' });
      const sc = Math.max(0, Math.round(Number(score) || 0));
      setNick(nm);

      const local = readLocal();
      let found = false;
      for (let i = 0; i < local.length; i++) {
        if (cleanName(local[i].name) === nm) {
          found = true;
          if (h > local[i].height) local[i] = { name: nm, height: h, score: sc, ts: Date.now() };
          break;
        }
      }
      if (!found) local.push({ name: nm, height: h, score: sc, ts: Date.now() });
      writeLocal(sortRows(local));

      const url = DB + '/' + encodeURIComponent(nm) + '.json';
      return fetch(url, { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(prev => {
          const ph = prev && isFinite(Number(prev.height)) ? Number(prev.height) : -1;
          if (h <= ph) return { ok: true, kept: true, msg: '이미 더 높은 내 기록이 있어요 (' + Math.round(ph) + 'm)' };
          return fetch(url, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: nm, height: h, score: sc, ts: Date.now() })
          }).then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          }).then(() => ({ ok: true, kept: false, msg: h + 'm · ' + sc.toLocaleString('ko-KR') + '점을 올렸어요!' }));
        })
        .then(res => { load(); return res; })
        .catch(() => ({ ok: true, offline: true, msg: '지금은 연결이 안 돼 이 기기에만 저장했어요' }));
    }

    function openPanel() {
      panel.classList.remove('hidden');
      panel.setAttribute('aria-hidden', 'false');
      render();
      load();
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = setInterval(() => { load(); }, 20000);
    }
    function closePanel() {
      panel.classList.add('hidden');
      panel.setAttribute('aria-hidden', 'true');
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    }
    function isOpen() { return !panel.classList.contains('hidden'); }

    return { nick: nick, setNick: setNick, load: load, submit: submit, open: openPanel, close: closePanel, isOpen: isOpen, render: render };
  })();

  /* ---------------- 기록 등록 UI ---------------- */
  const submitBtn = document.getElementById('submitBtn');
  const nickInput = document.getElementById('nickInput');
  const submitMsg = document.getElementById('submitMsg');
  let lastRun = { height: 0, score: 0 };
  let submitting = false;

  function prepareReg(hM) {
    lastRun = { height: Math.max(0, Math.round(hM)), score: Math.max(0, Math.floor(G.score)) };
    submitting = false;
    const low = lastRun.height < 1;
    submitMsg.textContent = low ? '1m 이상 올라가야 등록할 수 있어요' : '';
    submitMsg.classList.toggle('err', low);
    submitBtn.disabled = low;
    submitBtn.textContent = '기록 등록';
    nickInput.value = Rank.nick();
  }

  function doSubmit() {
    if (submitting) return;
    const nm = nickInput.value.trim();
    if (!nm) {
      submitMsg.textContent = '닉네임을 입력해 주세요';
      submitMsg.classList.add('err');
      try { nickInput.focus(); } catch (e) {}
      return;
    }
    submitting = true;
    submitBtn.disabled = true;
    submitBtn.textContent = '올리는 중…';
    submitMsg.classList.remove('err');
    submitMsg.textContent = '';
    Rank.submit(nm, lastRun.height, lastRun.score).then(res => {
      submitting = false;
      submitBtn.disabled = lastRun.height < 1;
      submitBtn.textContent = '기록 등록';
      submitMsg.textContent = res.msg || '';
      submitMsg.classList.toggle('err', !res.ok);
      if (res.ok) {
        Sound.milestone();
        setTimeout(() => { Rank.open(); }, 560);
      }
    });
  }

  /* =====================================================================
     13. 루프
     ===================================================================== */
  let last = 0;
  function frame(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 0.05);

    if (G.paused) {
      render();
      if (G.state === 'title') renderMascot();
      requestAnimationFrame(frame);
      return;
    }

    if (G.state === 'play') {
      update(dt);
    } else {
      G.t += dt * 0.6;
      // 게임오버 연출용 파티클 정리
      for (let i = G.particles.length - 1; i >= 0; i--) {
        const q = G.particles[i];
        q.life += dt;
        if (q.life >= q.max) { G.particles.splice(i, 1); continue; }
        q.vy -= q.grav * dt;
        q.x += q.vx * dt;
        q.y += q.vy * dt;
      }
      for (let i = G.popups.length - 1; i >= 0; i--) {
        const q = G.popups[i];
        q.life += dt;
        if (q.life >= q.max) { G.popups.splice(i, 1); continue; }
        q.y += q.vy * dt;
      }
    }

    render();
    if (G.state === 'title') renderMascot();
    requestAnimationFrame(frame);
  }

  /* =====================================================================
     14. 이벤트 연결
     ===================================================================== */
  document.getElementById('startBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    startGame();
  });
  document.getElementById('againBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    startGame();
  });
  function uiHit(e) {
    const t = e.target;
    if (!t || !t.closest) return false;
    return !!t.closest('button, input, .regrow, #rankPanel, #soundPanel');
  }
  document.getElementById('title').addEventListener('pointerdown', (e) => {
    if (uiHit(e) || Rank.isOpen()) return;
    startGame();
  });
  document.getElementById('over').addEventListener('pointerdown', (e) => {
    if (uiHit(e) || Rank.isOpen()) return;
    startGame();
  });
  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    Sound.unlock();
    toggleSoundPanel();
    syncSoundUi();
  });
  bgmSwitch.addEventListener('click', (e) => {
    e.stopPropagation();
    Sound.setBgm(Sound.bgmOff);
    syncSoundUi();
  });
  sfxSwitch.addEventListener('click', (e) => {
    e.stopPropagation();
    Sound.setSfx(Sound.sfxOff);
    syncSoundUi();
  });
  document.addEventListener('pointerdown', (e) => {
    if (soundPanel.classList.contains('closed')) return;
    if (e.target.closest && e.target.closest('#soundPanel, #muteBtn')) return;
    toggleSoundPanel(false);
  }, true);

  // 첫 터치/키 입력에 오디오 잠금 해제 + BGM 시작
  let gestureDone = false;
  function firstGesture() {
    if (gestureDone) return;
    gestureDone = true;
    Sound.unlock();
    syncSoundUi();
  }
  window.addEventListener('pointerdown', firstGesture, { passive: true });
  window.addEventListener('keydown', firstGesture);

  // 랭킹 UI
  submitBtn.addEventListener('click', (e) => { e.stopPropagation(); doSubmit(); });
  nickInput.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); doSubmit(); }
  });
  nickInput.addEventListener('input', () => {
    if (nickInput.value.length > 8) nickInput.value = nickInput.value.slice(0, 8);
  });
  document.getElementById('rankBtnTitle').addEventListener('click', (e) => {
    e.stopPropagation();
    Sound.unlock();
    Rank.open();
  });
  document.getElementById('rankBtnOver').addEventListener('click', (e) => {
    e.stopPropagation();
    Rank.open();
  });
  document.getElementById('rankRefresh').addEventListener('click', (e) => {
    e.stopPropagation();
    Rank.load();
  });
  document.getElementById('rankClose').addEventListener('click', (e) => {
    e.stopPropagation();
    Rank.close();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      G.paused = true;
      Sound.stopBgm();
    } else {
      G.paused = false;
      last = 0;
      if (!Sound.bgmOff) Sound.startBgm();
    }
  });
  window.addEventListener('blur', () => { G.paused = true; });
  window.addEventListener('focus', () => { G.paused = false; last = 0; });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      layout();
      if (G.state !== 'play') { resetWorld(); updateHud(); }
    }, 120);
  });

  /* =====================================================================
     15. 부팅
     ===================================================================== */
  layout();
  resetWorld();
  updateHud();
  syncSoundUi();
  shownB = -1;
  updateHud();
  Rank.render();
  Rank.load();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
