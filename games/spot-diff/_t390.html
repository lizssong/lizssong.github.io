<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mobile 390x844 harness</title>
<style>
  html,body{margin:0;background:#20242b;font-family:system-ui,sans-serif;}
  #wrap{display:flex;align-items:flex-start;justify-content:center;padding:20px;gap:20px;}
  #f{width:390px;height:844px;border:0;background:#fff;border-radius:14px;overflow:hidden;}
  #log{color:#cfd6df;font:12px/1.5 ui-monospace,monospace;max-width:700px;white-space:pre-wrap;}
</style>
</head>
<body>
<div id="wrap">
  <iframe id="f" src="./index.html"></iframe>
  <pre id="log">errors: 0</pre>
</div>
<script>
  var errs = [];
  window.__errs = errs;
  function paint(){ document.getElementById('log').textContent = 'errors: ' + errs.length + (errs.length ? '\n' + errs.join('\n') : ''); }
  var f = document.getElementById('f');
  f.addEventListener('load', function(){
    try{
      var w = f.contentWindow;
      w.addEventListener('error', function(e){ errs.push('error: ' + (e.message || e.type) + ' @' + (e.filename||'') + ':' + (e.lineno||'')); paint(); });
      w.addEventListener('unhandledrejection', function(e){ errs.push('rejection: ' + e.reason); paint(); });
      ['error','warn'].forEach(function(k){
        var o = w.console[k];
        w.console[k] = function(){ errs.push('console.' + k + ': ' + Array.prototype.join.call(arguments, ' ')); paint(); o.apply(w.console, arguments); };
      });
      paint();
    }catch(e){ errs.push('hook fail: ' + e.message); paint(); }
  });
</script>
</body>
</html>
