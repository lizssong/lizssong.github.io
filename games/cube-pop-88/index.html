<script>
(function(){

var SILENT_WAV = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YSADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==';

function audio(){

    var AC = window.AudioContext || window.webkitAudioContext;

      actx = new AC();

      comp.attack.value = 0.003; comp.release.value = 0.2;

function noiseBufSfx(ac){

  f.frequency.value = hp || 2400; f.Q.value = 0.9;
  var g = ac.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t0); s.stop(t0 + dur + 0.02);
}

/* ---------- BGM ---------- */
var BPM = 132;
var bgmTimer = null, bgmStep = 0, bgmNextT = 0, musicGain = null, bgmNoiseBuf = null;
var MELODY = [
  72,0,76,0, 79,0,76,0, 74,0,76,0, 79,0,0,0,
  72,0,76,0, 79,0,84,0, 81,0,79,0, 76,0,0,0,
  74,0,77,0, 81,0,77,0, 74,0,72,0, 74,0,76,0,
  79,0,76,0, 72,0,76,0, 79,0,81,0, 84,0,0,0
];
var BASS   = [36,33,29,31];
var CHORDS = [[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
var ARP    = [0,1,2,1];
function midiFreq(m){ return 440 * Math.pow(2, (m-69)/12); }
function musicBus(){
  if(!actx || !master) return null;
  if(!musicGain){
    musicGain = actx.createGain();
    musicGain.gain.value = 0.62;
    var lp = actx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 5200;
    musicGain.connect(lp); lp.connect(master);
  }
  return musicGain;
}
function noteAt(ac, freq, t, dur, type, gain){
  var bus = musicBus(); if(!bus) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bus);
  o.start(t); o.stop(t + dur + 0.03);
}
function kickAt(ac, t){
  var bus = musicBus(); if(!bus) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(46, t + 0.11);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.115, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
  o.connect(g); g.connect(bus);
  o.start(t); o.stop(t + 0.17);
}
function bgmNoise(ac, t, dur, gain, hpFreq){
  var bus = musicBus(); if(!bus) return;
  if(!bgmNoiseBuf){
    var len = Math.floor(ac.sampleRate * 0.25);
    bgmNoiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    var d = bgmNoiseBuf.getChannelData(0);
    for(var i=0;i<len;i++) d[i] = Math.random()*2 - 1;
  }
  var s = ac.createBufferSource(); s.buffer = bgmNoiseBuf;
  var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = hpFreq || 6000;
  var g = ac.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(hp); hp.connect(g); g.connect(bus);
  s.start(t); s.stop(t + dur + 0.02);
}
function bgmTick(){
  var ac = actx;
  if(!ac || muted) return;
  if(ac.state !== 'running'){
    if(ac.state === 'suspended' || ac.state === 'interrupted'){ resumeCtx(ac); }
    bgmNextT = ac.currentTime + 0.08;
    return;
  }
  if(bgmNextT < ac.currentTime){ bgmNextT = ac.currentTime + 0.08; }
  var stepDur = 60 / BPM / 4;
  var guard = 0;
  while(bgmNextT < ac.currentTime + 0.30 && guard < 60){
    var s = bgmStep % 64;
    var bar = (s >> 4) & 3;
    var chord = CHORDS[bar];
    var m = MELODY[s];
    if(m){
      noteAt(ac, midiFreq(m), bgmNextT, 0.15, 'square', 0.026);
      noteAt(ac, midiFreq(m), bgmNextT, 0.2, 'triangle', 0.045);
      noteAt(ac, midiFreq(m+12), bgmNextT, 0.09, 'sine', 0.014);
    }
    if(s % 16 === 0 || s % 16 === 8) noteAt(ac, midiFreq(BASS[bar]), bgmNextT, 0.3, 'triangle', 0.10);
    else if(s % 16 === 6 || s % 16 === 12) noteAt(ac, midiFreq(BASS[bar]+7), bgmNextT, 0.16, 'sine', 0.05);
    if(s % 2 === 0) noteAt(ac, midiFreq(chord[ARP[(s>>1) % 4]] + 12), bgmNextT, 0.10, 'sine', 0.021);
    if(s % 16 === 0) noteAt(ac, midiFreq(chord[0] + 12), bgmNextT, 0.8, 'sine', 0.016);
    if(s % 8 === 0) kickAt(ac, bgmNextT);
    if(s % 4 === 2) bgmNoise(ac, bgmNextT, 0.03, 0.010, 7200);
    if(s % 16 === 14) bgmNoise(ac, bgmNextT, 0.07, 0.014, 4200);
    bgmStep++;
    bgmNextT += stepDur;
    guard++;
  }
}
function bgmStart(){
  if(muted) return;
  var ac = audio(); if(!ac) return;
  musicBus();
  keepAliveStart();
  if(bgmTimer) return;
  bgmNextT = ac.currentTime + 0.08;
  bgmStep = 0;
  bgmTimer = setInterval(bgmTick, 40);
}
function bgmStop(){
  if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; }
}

var audioEvents = ['touchstart','touchend','pointerdown','pointerup','click','mousedown','keydown'];
function unlockAudio(){
  setPlaybackSession();
  if(muted) return;
  var ac = audio();
  if(!ac) return;
  primeAudio(ac);
  resumeCtx(ac);
  keepAliveStart();
  bgmStart();
  if(actx && actx.state === 'running'){
    audioEvents.forEach(function(t){ window.removeEventListener(t, unlockAudio, true); });
  }
}
audioEvents.forEach(function(t){
  window.addEventListener(t, unlockAudio, {passive:true, capture:true});
});
function rearmAudio(){
  if(muted) return;
  setPlaybackSession();
  if(!actx && !bgmTimer && !keepAliveEl) return;
  var ac = audio();
  if(ac){ primeAudio(ac); resumeCtx(ac); keepAliveStart(); }
  bgmStart();
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ bgmStop(); return; }
  rearmAudio();
});
window.addEventListener('pageshow', rearmAudio);
window.addEventListener('focus', rearmAudio);

function mkShape(id, rows, wt){
  var cells = [], h = rows.length, w = 0;
  for(var r=0;r<rows.length;r++){
    var line = rows[r];
    if(line.length > w) w = line.length;
    for(var c=0;c<line.length;c++){
      if(line.charAt(c) === 'X') cells.push([r,c]);
    }
  }
  return { id:id, w:w, h:h, cells:cells, wt:wt };
}
var SHAPES = [

var SHAPE_TOTAL = 0;
SHAPES.forEach(function(s){ SHAPE_TOTAL += s.wt; });

var COLORS = [
  {l:'#FFA3B0', b:'#FF4D6D', d:'#C11F3E'},
  {l:'#FFC98F', b:'#FF8A2B', d:'#BE5800'},
  {l:'#FFEE96', b:'#FFC61A', d:'#C08E00'},

];

function makePiece(shape){
  return {
    id: shape.id, w: shape.w, h: shape.h, cells: shape.cells,
    color: Math.floor(Math.random()*COLORS.length)
  };
}
function rollPiece(){
  var x = Math.random()*SHAPE_TOTAL;
  for(var i=0;i<SHAPES.length;i++){
    x -= SHAPES[i].wt;
    if(x <= 0) return makePiece(SHAPES[i]);
  }
  return makePiece(SHAPES[0]);
}

var SIZE = 8;
var grid = [];
var tray = [null,null,null];

function emptyGrid(){

/* =========================================================================
   5. 레이아웃
   ========================================================================= */
var W = 0, H = 0, dpr = 1, safeTop = 0, safeBot = 0;
var GEO = {x:0, y:0, size:0, cell:0, gap:0};
var trayY = 0, trayH = 0, hudH = 96, dockY = 0;
var cv = $('#cv'), ctx = cv.getContext('2d');

function measureSafeArea(){
  try{
    var p = document.createElement('div');
    p.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;' +
      'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);';
    document.body.appendChild(p);
    var cs = getComputedStyle(p);
    safeTop = parseFloat(cs.paddingTop) || 0;
    safeBot = parseFloat(cs.paddingBottom) || 0;
    document.body.removeChild(p);
  }catch(e){ safeTop = 0; safeBot = 0; }
}

function layout(){
  measureSafeArea();
  W = window.innerWidth;
  H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W*dpr);
  cv.height = Math.round(H*dpr);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';

  var padX = 12;
  var maxBoard = Math.min(W - padX*2, 520);
  var avail = H - safeTop - safeBot;
  var dockH = 46;
  // 전체 높이 = hudH + 8 + B + 16 + (0.30B+18) + 10 + dockH
  var bByH = (avail - hudH - 8 - 16 - 18 - 10 - dockH - 12) / 1.30;
  var B = Math.max(200, Math.min(maxBoard, bByH));
  var gap = Math.max(3, Math.round(B*0.013));
  var cell = (B - gap*(SIZE-1)) / SIZE;

  trayH = Math.round(B*0.30 + 18);
  var total = hudH + 8 + B + 16 + trayH + 10 + dockH;
  var startY = safeTop + Math.max(4, (avail - total)/2 - 2);

  GEO.x = Math.round((W - B)/2);
  GEO.y = Math.round(startY + hudH + 8);
  GEO.size = B;
  GEO.cell = cell;
  GEO.gap = gap;

  trayY = Math.round(GEO.y + B + 16);
  dockY = Math.round(trayY + trayH + 10);

  var hud = $('#hud');
  hud.style.top = Math.round(startY) + 'px';
  hud.style.height = hudH + 'px';
  var dock = $('#dock');
  dock.style.top = dockY + 'px';

  document.body.style.paddingBottom = safeBot + 'px';
}

function slotRect(i){
  var total = Math.min(W, GEO.size + 24);
  var m = 12, g = 8;
  var left = (W - total)/2;
  var w = (total - m*2 - g*2)/3;
  return { x: left + m + i*(w+g), y: trayY, w: w, h: trayH };
}
function pieceCellSize(p){
  var s = slotRect(0).w;
  return Math.min(GEO.cell*0.62, (s - 18) / Math.max(p.w, p.h));
}
function pieceBox(p, i){
  var s = slotRect(i);
  var cs = pieceCellSize(p);
  var w = p.w*cs, h = p.h*cs;
  return { x: s.x + (s.w - w)/2, y: s.y + (s.h - h)/2, cs: cs, w: w, h: h };
}
function cellX(c){ return GEO.x + c*(GEO.cell + GEO.gap); }
function cellY(r){ return GEO.y + r*(GEO.cell + GEO.gap); }

/* =========================================================================
   6. 규칙
   ========================================================================= */
function canPlace(p, r0, c0){
  if(!p) return false;
  if(r0 < 0 || c0 < 0 || r0 + p.h > SIZE || c0 + p.w > SIZE) return false;
  for(var i=0;i<p.cells.length;i++){
    var r = r0 + p.cells[i][0], c = c0 + p.cells[i][1];
    if(grid[r][c] !== -1) return false;
  }
  return true;
}
function anyPlace(p){
  if(!p) return false;
  for(var r=0;r+p.h<=SIZE;r++){
    for(var c=0;c+p.w<=SIZE;c++){
      if(canPlace(p, r, c)) return true;
    }
  }
  return false;
}
function findSpot(p){
  for(var r=0;r+p.h<=SIZE;r++){
    for(var c=0;c+p.w<=SIZE;c++){
      if(canPlace(p, r, c)) return {r:r, c:c};
    }
  }
  return null;
}
function fitWeighted(){
  // 놓을 수 있는 조각 중 하나 고르기 (작은 조각 우선)
  var pool = [];
  for(var i=0;i<SHAPES.length;i++){
    var p = makePiece(SHAPES[i]);
    if(anyPlace(p)) pool.push({shape:SHAPES[i], wt:SHAPES[i].wt});
  }
  if(!pool.length) return null;
  var tot = 0;
  pool.forEach(function(o){ tot += o.wt; });
  var x = Math.random()*tot;
  for(var j=0;j<pool.length;j++){
    x -= pool[j].wt;
    if(x <= 0) return makePiece(pool[j].shape);
  }
  return makePiece(pool[0].shape);
}

function dealTray(){
  tray = [rollPiece(), rollPiece(), rollPiece()];
  if(!tray.some(function(p){ return p && anyPlace(p); })){
    // 억울한 조기 게임오버 방지: 놓을 수 있는 조각으로 한 칸 교체
    var fit = fitWeighted();
    if(fit) tray[Math.floor(Math.random()*3)] = fit;
  }
  updateDock();
}

/* =========================================================================
   8. 턴 처리
   ========================================================================= */
function placePiece(idx, r0, c0){
  var p = tray[idx];
  if(!p || !canPlace(p, r0, c0)) return false;
  for(var i=0;i<p.cells.length;i++){
    var r = r0 + p.cells[i][0], c = c0 + p.cells[i][1];
    grid[r][c] = p.color;
    pops.push({ r:r, c:c, t:0, dur:0.24 });
  }
  tray[idx] = null;
  lastPlaced = { r0:r0, c0:c0, w:p.w, h:p.h };
  sfxPlace();
  addScore(p.cells.length * 2);
  resolveClear();
  updateDock();
  return true;
}

function resolveClear(){
  var rows = [], cols = [];
  for(var r=0;r<SIZE;r++){
    var full = true;
    for(var c=0;c<SIZE;c++){ if(grid[r][c] === -1){ full = false; break; } }
    if(full) rows.push(r);
  }
  for(var cc=0;cc<SIZE;cc++){
    var ok = true;
    for(var rr=0;rr<SIZE;rr++){ if(grid[rr][cc] === -1){ ok = false; break; } }
    if(ok) cols.push(cc);
  }
  if(!rows.length && !cols.length){
    combo = 0;
    afterTurn();
    return;
  }

  combo++;
  if(combo > comboBest) comboBest = combo;
  linesTotal += rows.length + cols.length;

  var cross = rows.length > 0 && cols.length > 0;
  var lines = rows.length + cols.length;
  var mult = Math.min(4, 1 + 0.5*(Math.max(1, combo) - 1));
  var base = lines * 100 + (cross ? 120 : 0) + Math.max(0, lines - 1) * 40;
  var pts = Math.round(base * mult);

  // 지울 칸 모으기
  var seen = {}, cells = [];
  rows.forEach(function(r){
    for(var c=0;c<SIZE;c++){
      var k = r*SIZE + c;
      if(!seen[k]){ seen[k] = 1; cells.push({ r:r, c:c }); }
    }
  });
  cols.forEach(function(c){
    for(var r=0;r<SIZE;r++){
      var k = r*SIZE + c;
      if(!seen[k]){ seen[k] = 1; cells.push({ r:r, c:c }); }
    }
  });

  cells.forEach(function(o){
    var ci = grid[o.r][o.c];
    if(ci < 0) return;
    o.color = ci;
    var cx = cellX(o.c) + GEO.cell/2;
    var cy = cellY(o.r) + GEO.cell/2;
    spawnParticles(cx, cy, ci, 5 + Math.round(Math.random()*3));
    grid[o.r][o.c] = -1;
  });

  clearAnim = { t:0, dur:0.46, cells:cells, rows:rows, cols:cols };
  inputBlocked = true;
  drag = null;

  addScore(pts);
  sfxClear(combo);
  if(combo >= 2) setTimeout(sfxCombo, 120);
  shake(combo >= 3 ? 9 : 6, 0.36);

  if(cross) showBanner('PERFECT!', '+'+pts.toLocaleString('ko-KR'), 'perfect');
  else if(combo >= 2) showBanner('COMBO ×'+combo, '+'+pts.toLocaleString('ko-KR'), 'combo');
  else showBanner('+'+pts.toLocaleString('ko-KR'), '', 'clear');
}

function afterTurn(){
  if(!tray.some(function(p){ return !!p; })) dealTray();
  if(!tray.some(function(p){ return p && anyPlace(p); })){
    endGame();
  }
}

function endGame(){
  if(state !== 'play') return;
  state = 'over';
  sfxOver();
  bgmStop();
  updateDock();
  setTimeout(function(){
    $('#finalScore').textContent = score.toLocaleString('ko-KR');
    $('#bestOver').textContent = best.toLocaleString('ko-KR');
    $('#linesOver').textContent = String(linesTotal);
    $('#comboOver').textContent = String(comboBest);
    $('#newBest').classList.toggle('on', newBestThisRun);
    $('#nickInput').value = Rank.nick();
    $('#regMsg').textContent = '';
    $('#regMsg').classList.remove('err');
    $('#btnRegister').disabled = score <= 0;
    $('#overModal').classList.add('show');
  }, 460);
}

/* =========================================================================
   9. 부스터
   ========================================================================= */
function useRefresh(){
  if(state !== 'play' || inputBlocked) return;
  if(refreshCharge <= 0){ showToast('새로고침이 없어요'); sfxDeny(); return; }
  var had = tray.filter(function(p){ return !!p; }).length;
  if(!had){ showToast('바꿀 조각이 없어요'); sfxDeny(); return; }
  refreshCharge--;
  dealTray();
  sfxRefresh();
  showToast('새 조각!');
  updateDock();
  // 새 조각으로도 하나는 놓을 수 있게 보정
  if(!tray.some(function(p){ return p && anyPlace(p); })){
    var fit = fitWeighted();
    if(fit) tray[0] = fit;
  }
  if(!tray.some(function(p){ return p && anyPlace(p); })) endGame();
}
function useBombAt(r, c){
  if(bombCharge <= 0) return;
  var hit = [];
  for(var dr=-1;dr<=1;dr++){
    for(var dc=-1;dc<=1;dc++){
      var rr = r+dr, cc = c+dc;
      if(rr<0||cc<0||rr>=SIZE||cc>=SIZE) continue;
      if(grid[rr][cc] !== -1) hit.push({r:rr,c:cc});
    }
  }
  if(!hit.length){ sfxDeny(); showToast('터뜨릴 큐브가 없어요'); return; }
  bombCharge--;
  bombArmed = false;
  hit.forEach(function(o){
    var ci = grid[o.r][o.c];
    grid[o.r][o.c] = -1;
    spawnParticles(cellX(o.c)+GEO.cell/2, cellY(o.r)+GEO.cell/2, ci, 5);
  });
  sfxBomb();
  shake(11, 0.42);
  addScore(hit.length * 5);
  updateDock();
  showToast(hit.length + '칸 제거!');
  if(!tray.some(function(p){ return p && anyPlace(p); }) && tray.some(function(p){ return !!p; })){
    // 폭탄으로 자리가 생겼는지 확인 후에도 없으면 게임오버
    endGame();
  }
}

/* =========================================================================
   10. 파티클 · 연출
   ========================================================================= */
function spawnParticles(cx, cy, ci, n){
  var c = COLORS[ci % COLORS.length];
  for(var i=0;i<n;i++){
    var ang = rnd(0, Math.PI*2);
    var spd = rnd(70, 300);
    particles.push({
      x:cx, y:cy,
      vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd - rnd(30,150),
      g:rnd(700,1150),
      life:0, max:rnd(0.42,0.82),
      size:rnd(4, 11),
      rot:rnd(0, Math.PI), vr:rnd(-9, 9),
      color: c.b, light: c.l
    });
  }
  if(particles.length > 320) particles.splice(0, particles.length - 320);
}
function shake(mag, dur){
  shakeMag = mag; shakeDur = dur; shakeT = dur;
}
function showBanner(text, sub, kind){
  banner = { text:text, sub:sub || '', kind:kind || 'clear', t:0, dur:1.05 };
}

function updateEffects(dt){
  var i;
  for(i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.life += dt;
    if(p.life >= p.max){ particles.splice(i,1); continue; }
    p.vy += p.g*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1 - 1.2*dt);
    p.rot += p.vr*dt;
  }
  for(i=pops.length-1;i>=0;i--){
    pops[i].t += dt;
    if(pops[i].t >= pops[i].dur) pops.splice(i,1);
  }
  if(clearAnim){
    if(!animFreeze){
      clearAnim.t += dt;
      if(clearAnim.t >= clearAnim.dur){
        clearAnim = null;
        inputBlocked = false;
        afterTurn();
      }
    }
  }
  if(banner){
    banner.t += dt;
    if(banner.t >= banner.dur) banner = null;
  }
  if(toast){
    toast.t += dt;
    if(toast.t >= toast.dur) toast = null;
  }
  if(shakeT > 0){
    shakeT -= dt;
    if(shakeT < 0) shakeT = 0;
  }
}

/* =========================================================================
   11. 그리기
   ========================================================================= */
function rr(x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawBlock(x, y, s, ci, o){
  o = o || {};
  var a = o.alpha == null ? 1 : o.alpha;
  var sc = o.scale == null ? 1 : o.scale;
  if(a <= 0.012 || sc <= 0.02) return;
  var c = COLORS[ci % COLORS.length];
  ctx.save();
  ctx.globalAlpha = a;
  if(sc !== 1){
    var cx = x + s/2, cy = y + s/2;
    ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
  }
  var p = s*0.055;
  var w = s - p*2;
  var rad = w*0.27;

  if(!o.ghost){
    ctx.fillStyle = 'rgba(3,7,20,.5)';
    rr(x+p*0.7, y+p*1.85, w, w, rad); ctx.fill();
  }

  var g = ctx.createLinearGradient(0, y+p, 0, y+p+w);
  g.addColorStop(0, c.l);
  g.addColorStop(0.46, c.b);
  g.addColorStop(1, c.d);
  ctx.fillStyle = g;
  rr(x+p, y+p, w, w, rad); ctx.fill();

  // 위쪽 광택
  var gl = ctx.createLinearGradient(0, y+p+w*0.06, 0, y+p+w*0.44);
  gl.addColorStop(0, 'rgba(255,255,255,.55)');
  gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl;
  rr(x+p+w*0.11, y+p+w*0.07, w*0.78, w*0.36, rad*0.75); ctx.fill();

  // 아래쪽 어둠
  ctx.fillStyle = 'rgba(0,0,0,.16)';
  rr(x+p+w*0.12, y+p+w*0.74, w*0.76, w*0.20, rad*0.7); ctx.fill();

  // 테두리
  ctx.strokeStyle = o.ghost ? 'rgba(255,255,255,.75)' : 'rgba(255,255,255,.34)';
  ctx.lineWidth = Math.max(1, w*0.045);
  rr(x+p+ctx.lineWidth/2, y+p+ctx.lineWidth/2, w-ctx.lineWidth, w-ctx.lineWidth, rad);
  ctx.stroke();

  if(o.ghost){
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = Math.max(1.2, w*0.05);
    ctx.setLineDash([w*0.16, w*0.12]);
    rr(x+p, y+p, w, w, rad); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawBoard(){
  var s = GEO.size;
  // 판 패널
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)';
  ctx.shadowBlur = 26;
  ctx.shadowOffsetY = 10;
  var bg = ctx.createLinearGradient(GEO.x, GEO.y, GEO.x, GEO.y + s);
  bg.addColorStop(0, '#1B2851');
  bg.addColorStop(1, '#141D3E');
  ctx.fillStyle = bg;
  rr(GEO.x - 7, GEO.y - 7, s + 14, s + 14, 22); ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,.10)';
  ctx.lineWidth = 1.2;
  rr(GEO.x - 7, GEO.y - 7, s + 14, s + 14, 22); ctx.stroke();

  // 빈 칸
  var cell = GEO.cell, gap = GEO.gap;
  for(var r=0;r<SIZE;r++){
    for(var c=0;c<SIZE;c++){
      var x = cellX(c), y = cellY(r);
      ctx.fillStyle = 'rgba(255,255,255,.048)';
      rr(x, y, cell, cell, cell*0.2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.045)';
      ctx.lineWidth = 1;
      rr(x+0.5, y+0.5, cell-1, cell-1, cell*0.2); ctx.stroke();
    }
  }

  // 채워진 칸
  for(r=0;r<SIZE;r++){
    for(c=0;c<SIZE;c++){
      var v = grid[r][c];
      if(v === -1) continue;
      var sc = 1;
      for(var i=0;i<pops.length;i++){
        if(pops[i].r === r && pops[i].c === c){
          var k = pops[i].t / pops[i].dur;
          sc = 0.72 + 0.28*k + Math.sin(k*Math.PI)*0.20;
        }
      }
      drawBlock(cellX(c), cellY(r), cell, v, { scale:sc });
    }
  }

  // 지워지는 칸
  if(clearAnim){
    for(var j=0;j<clearAnim.cells.length;j++){
      var o = clearAnim.cells[j];
      var kk = clamp((clearAnim.t - j*0.008) / (clearAnim.dur*0.90), 0, 1);
      var flash = clamp(1 - kk/0.55, 0, 1);
      var fade = kk <= 0.55 ? 1 : 1 - (kk-0.55)/0.45;
      var sc2 = 1 + kk*0.5;
      drawBlock(cellX(o.c), cellY(o.r), cell, o.color, { scale:sc2, alpha:Math.max(0, fade) });
      if(flash > 0.01){
        ctx.save();
        ctx.globalAlpha = flash*0.9;
        ctx.fillStyle = '#FFFFFF';
        rr(cellX(o.c)+cell*0.07, cellY(o.r)+cell*0.07, cell*0.86, cell*0.86, cell*0.22);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  // 줄이 터지는 빛줄기
  if(clearAnim && (clearAnim.rows || clearAnim.cols)){
    var pk = clamp(clearAnim.t / (clearAnim.dur*0.72), 0, 1);
    var ba = (1 - pk) * 0.5;
    if(ba > 0.01){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = ba;
      var bw = cell*0.9;
      (clearAnim.rows || []).forEach(function(r){
        var gy = cellY(r) + cell/2;
        var lg = ctx.createLinearGradient(GEO.x, 0, GEO.x + GEO.size, 0);
        lg.addColorStop(0, 'rgba(255,240,170,0)');
        lg.addColorStop(0.5, 'rgba(255,248,210,1)');
        lg.addColorStop(1, 'rgba(255,240,170,0)');
        ctx.fillStyle = lg;
        ctx.fillRect(GEO.x - 4, gy - bw/2, GEO.size + 8, bw);
      });
      (clearAnim.cols || []).forEach(function(c){
        var gx = cellX(c) + cell/2;
        var lg2 = ctx.createLinearGradient(0, GEO.y, 0, GEO.y + GEO.size);
        lg2.addColorStop(0, 'rgba(255,240,170,0)');
        lg2.addColorStop(0.5, 'rgba(255,248,210,1)');
        lg2.addColorStop(1, 'rgba(255,240,170,0)');
        ctx.fillStyle = lg2;
        ctx.fillRect(gx - bw/2, GEO.y - 4, bw, GEO.size + 8);
      });
      ctx.restore();
    }
  }

  // 폭탄 조준
  if(bombArmed){
    ctx.save();
    var pulse = 0.10 + 0.06*Math.sin(timeS*8);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,110,60,'+pulse+')';
    rr(GEO.x-7, GEO.y-7, s+14, s+14, 22); ctx.fill();
    ctx.restore();
  }
}

function drawLineHighlight(){
  if(!drag || !drag.valid) return;
  var p = drag.piece;
  var occ = {};
  for(var r=0;r<SIZE;r++) for(var c=0;c<SIZE;c++) if(grid[r][c] !== -1) occ[r*SIZE+c] = 1;
  var placed = {};
  for(var i=0;i<p.cells.length;i++){
    var rr2 = drag.r0 + p.cells[i][0], cc2 = drag.c0 + p.cells[i][1];
    occ[rr2*SIZE+cc2] = 1;
    placed[rr2*SIZE+cc2] = 1;
  }
  var rows = [], cols = [];
  for(r=0;r<SIZE;r++){
    var full = true;
    for(c=0;c<SIZE;c++) if(!occ[r*SIZE+c]){ full = false; break; }
    if(full) rows.push(r);
  }
  for(c=0;c<SIZE;c++){
    var ok = true;
    for(r=0;r<SIZE;r++) if(!occ[r*SIZE+c]){ ok = false; break; }
    if(ok) cols.push(c);
  }
  if(!rows.length && !cols.length) return;

  var pulse = 0.20 + 0.13*Math.sin(timeS*14);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var cell = GEO.cell, gap = GEO.gap;
  for(i=0;i<rows.length;i++){
    var y = cellY(rows[i]);
    ctx.fillStyle = 'rgba(255,226,110,'+pulse+')';
    rr(GEO.x - gap, y - gap*0.5, GEO.size + gap*2, cell + gap, cell*0.22); ctx.fill();
  }
  for(i=0;i<cols.length;i++){
    var x = cellX(cols[i]);
    ctx.fillStyle = 'rgba(255,226,110,'+pulse+')';
    rr(x - gap*0.5, GEO.y - gap, cell + gap, GEO.size + gap*2, cell*0.22); ctx.fill();
  }
  ctx.restore();
}

function drawTray(){
  var cell = GEO.cell;
  for(var i=0;i<3;i++){
    var s = slotRect(i);
    var active = drag && drag.idx === i;
    ctx.save();
    ctx.fillStyle = active ? 'rgba(255,255,255,.035)' : 'rgba(255,255,255,.045)';
    rr(s.x, s.y, s.w, s.h, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.07)';
    ctx.lineWidth = 1;
    rr(s.x+0.5, s.y+0.5, s.w-1, s.h-1, 16); ctx.stroke();
    ctx.restore();

    var p = tray[i];
    if(!p) continue;
    if(drag && drag.idx === i) continue;
    var box = pieceBox(p, i);
    for(var j=0;j<p.cells.length;j++){
      var cx = box.x + p.cells[j][1]*box.cs;
      var cy = box.y + p.cells[j][0]*box.cs;
      drawBlock(cx, cy, box.cs, p.color, {});
    }
  }
}

function drawDrag(){
  if(!drag) return;
  var p = drag.piece;
  var cell = GEO.cell;

  // 고스트
  if(drag.valid){
    for(var i=0;i<p.cells.length;i++){
      var x = cellX(drag.c0 + p.cells[i][1]);
      var y = cellY(drag.r0 + p.cells[i][0]);
      drawBlock(x, y, cell, p.color, { alpha:0.45, ghost:true });
    }
  }

  // 들고 있는 조각
  var popScale = drag.pop;
  for(var j=0;j<p.cells.length;j++){
    var dx = drag.left + p.cells[j][1]*cell;
    var dy = drag.top + p.cells[j][0]*cell;
    drawBlock(dx, dy, cell, p.color, { scale:popScale, alpha:0.97 });
  }

  // 잘못 놓을 자리 표시
  if(!drag.valid && drag.overBoard){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,90,110,.75)';
    ctx.lineWidth = 3;
    ctx.setLineDash([8,6]);
    var bx = cellX(clamp(drag.c0,0,SIZE-p.w));
    var by = cellY(clamp(drag.r0,0,SIZE-p.h));
    rr(bx, by, p.w*cell + (p.w-1)*GEO.gap, p.h*cell + (p.h-1)*GEO.gap, 10);
    ctx.stroke();
    ctx.restore();
  }
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p = particles[i];
    var t = p.life / p.max;
    var a = 1 - t*t;
    if(a <= 0) continue;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    var s = p.size * (1 - t*0.45);
    ctx.fillStyle = p.color;
    rr(-s/2, -s/2, s, s, s*0.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    rr(-s/2 + s*0.16, -s/2 + s*0.14, s*0.4, s*0.26, s*0.12); ctx.fill();
    ctx.restore();
  }
}

function fontStack(size, weight){
  return (weight || 900) + ' ' + size + 'px "Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif';
}

function drawBanner(){
  if(!banner) return;
  var t = banner.t / banner.dur;
  var s, a;
  if(t < 0.16){ s = 0.55 + (t/0.16)*0.62; a = t/0.16; }
  else if(t < 0.30){ s = 1.17 - ((t-0.16)/0.14)*0.17; a = 1; }
  else { s = 1; a = t > 0.72 ? 1 - (t-0.72)/0.28 : 1; }
  var cx = W/2;
  var cy = GEO.y + GEO.size*0.44 + Math.sin(t*4)*4;

  ctx.save();
  ctx.globalAlpha = Math.max(0, a);
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  /* 아래에서 폭 맞춤 스케일을 한 번 더 건다 */

  var isC = banner.kind !== 'clear';
  var size = isC ? 42 : 46;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = fontStack(size);
  var tw = ctx.measureText(banner.text).width;
  var fit = Math.min(1, (W - 40) / Math.max(1, tw));
  ctx.scale(fit, fit);
  var grad = ctx.createLinearGradient(0, -size*0.7, 0, size*0.7);
  if(banner.kind === 'perfect'){ grad.addColorStop(0,'#FFF3B0'); grad.addColorStop(0.5,'#FFD34D'); grad.addColorStop(1,'#FF8A2B'); }
  else if(banner.kind === 'combo'){ grad.addColorStop(0,'#FFFFFF'); grad.addColorStop(0.5,'#9BD0FF'); grad.addColorStop(1,'#5C8DF6'); }
  else { grad.addColorStop(0,'#FFFFFF'); grad.addColorStop(1,'#BFD4FF'); }

  ctx.lineWidth = 9;
  ctx.strokeStyle = 'rgba(10,16,38,.85)';
  ctx.strokeText(banner.text, 0, 0);
  ctx.fillStyle = grad;
  ctx.fillText(banner.text, 0, 0);

  if(banner.sub){
    ctx.font = fontStack(19, 900);
    ctx.lineWidth = 7;
    ctx.strokeStyle = 'rgba(10,16,38,.85)';
    ctx.strokeText(banner.sub, 0, size*0.82);
    ctx.fillStyle = '#FFE066';
    ctx.fillText(banner.sub, 0, size*0.82);
  }
  ctx.restore();
}

function drawToast(){
  if(!toast) return;
  var t = toast.t / toast.dur;
  var a = t < 0.12 ? t/0.12 : (t > 0.75 ? 1 - (t-0.75)/0.25 : 1);
  var y = trayY - 26 - t*10;
  ctx.save();
  ctx.globalAlpha = Math.max(0, a);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = fontStack(13, 800);
  var w = ctx.measureText(toast.text).width + 30;
  ctx.fillStyle = 'rgba(20,30,62,.92)';
  rr(W/2 - w/2, y - 15, w, 30, 15); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.16)';
  ctx.lineWidth = 1;
  rr(W/2 - w/2 + 0.5, y - 14.5, w-1, 29, 15); ctx.stroke();
  ctx.fillStyle = '#E7EEFF';
  ctx.fillText(toast.text, W/2, y);
  ctx.restore();
}

function render(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  if(shakeT > 0){
    var m = shakeMag * (shakeT / shakeDur);
    ctx.translate(rnd(-m, m), rnd(-m, m));
  }
  drawBoard();
  drawLineHighlight();
  drawTray();
  drawDrag();
  drawParticles();
  ctx.restore();

  drawBanner();
  drawToast();
}

/* =========================================================================
   12. 입력
   ========================================================================= */
function pt(e){
  return { x: e.clientX, y: e.clientY };
}
function insideBoard(p){
  return p.x >= GEO.x - 12 && p.x <= GEO.x + GEO.size + 12 &&
         p.y >= GEO.y - 12 && p.y <= GEO.y + GEO.size + 12;
}
function boardCellAt(p){
  var c = Math.floor((p.x - GEO.x) / (GEO.cell + GEO.gap));
  var r = Math.floor((p.y - GEO.y) / (GEO.cell + GEO.gap));
  if(r < 0 || c < 0 || r >= SIZE || c >= SIZE) return null;
  return { r:r, c:c };
}

function onDown(e){
  if(state !== 'play') return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  var p = pt(e);

  if(inputBlocked) return;

  if(bombArmed){
    var bc = boardCellAt(p);
    if(bc){ useBombAt(bc.r, bc.c); return; }
    // 판 밖을 누르면 폭탄 모드 취소하고 조각 집기로 이어간다
    bombArmed = false; updateDock(); sfxTap();
  }

  if(drag) return;

  // 트레이 조각 집기
  for(var i=0;i<3;i++){
    var pl = tray[i];
    if(!pl) continue;
    var s = slotRect(i);
    if(p.x < s.x - 6 || p.x > s.x + s.w + 6 || p.y < s.y - 8 || p.y > s.y + s.h + 8) continue;
    startDrag(i, p, e.pointerType);
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
    return;
  }
}

function startDrag(i, p, ptype){
  var pl = tray[i];
  var box = pieceBox(pl, i);
  var ar = clamp(Math.floor((p.y - box.y) / box.cs), 0, pl.h - 1);
  var ac = clamp(Math.floor((p.x - box.x) / box.cs), 0, pl.w - 1);
  // 실제 셀에 가장 가까운 칸 선택
  var best = null, bd = 1e9;
  for(var k=0;k<pl.cells.length;k++){
    var d = Math.abs(pl.cells[k][0] - ar) + Math.abs(pl.cells[k][1] - ac);
    if(d < bd){ bd = d; best = pl.cells[k]; }
  }
  if(!best) best = pl.cells[0];
  drag = {
    idx:i, piece:pl,
    anchorR:best[0], anchorC:best[1],
    lift: ptype === 'mouse' ? 6 : 62,
    left:0, top:0, r0:0, c0:0, valid:false, overBoard:false,
    pop:0.78, startT:timeS
  };
  sfxPick();
  updateDrag(p);
}
function updateDrag(p){
  if(!drag) return;
  var cell = GEO.cell;
  drag.left = p.x - (drag.anchorC + 0.5)*cell;
  drag.top  = p.y - drag.lift - (drag.anchorR + 0.5)*cell;
  drag.c0 = Math.round((drag.left - GEO.x) / (cell + GEO.gap));
  drag.r0 = Math.round((drag.top - GEO.y) / (cell + GEO.gap));
  drag.valid = canPlace(drag.piece, drag.r0, drag.c0);
  drag.overBoard = insideBoard(p);
}
function onMove(e){
  if(!drag) return;
  updateDrag(pt(e));
  if(e.cancelable) e.preventDefault();
}
function onUp(e){
  if(!drag) return;
  var d = drag;
  drag = null;
  try{ cv.releasePointerCapture(e.pointerId); }catch(err){}
  if(d.valid && state === 'play' && !inputBlocked){
    placePiece(d.idx, d.r0, d.c0);
  } else {
    if(d.overBoard) sfxDeny();
  }
  updateDock();
}

cv.addEventListener('pointerdown', onDown, {passive:false});
window.addEventListener('pointermove', onMove, {passive:false});
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* =========================================================================
   13. 랭킹 (Firebase RTDB · 실패 시 로컬)
   ========================================================================= */
var Rank = (function(){
  var DB = 'https://hangang-monster-default-rtdb.asia-southeast1.firebasedatabase.app/games/block-blast-leaderboard';
  var LIMIT = 10;
  var rows = [], rState = 'idle', lastAt = 0, inflight = null, autoTimer = null;
  var memLocal = [];
  var panel = $('#rankModal'), listEl = $('#rankList'), subEl = $('#rankSub');

  function esc(v){
    return String(v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function cleanName(v){
    var t = String(v == null ? '' : v).replace(/[.#$\[\]\/\\]/g,'').replace(/\s+/g,' ').trim();
    return t.length > 8 ? t.slice(0,8) : t;
  }
  function nick(){
    var n = LS.get(SKEY.nick, '');
    return cleanName(n) || '';
  }
  function setNick(v){
    var n = cleanName(v);
    LS.set(SKEY.nick, n);
    return n;
  }
  function readLocal(){
    var list = [];
    try{
      var a = JSON.parse(LS.get(SKEY.rank,'[]'));
      if(Array.isArray(a)){
        list = a.filter(function(r){ return r && r.name && isFinite(Number(r.score)); })
          .map(function(r){
            return { name: cleanName(r.name) || '플레이어', score: Math.max(0, Math.round(Number(r.score))), lines: Math.max(0, Math.round(Number(r.lines)||0)), ts: Number(r.ts)||0 };
          });
      }
    }catch(e){}
    if(!list.length && memLocal.length) list = memLocal.slice();
    return list;
  }
  function writeLocal(list){
    memLocal = list.slice(0,40);
    LS.set(SKEY.rank, JSON.stringify(list.slice(0,40)));
  }
  function sortRows(list){
    return list.slice().sort(function(a,b){ return b.score - a.score || a.ts - b.ts; });
  }
  function normalize(obj){
    var out = [];
    if(!obj || typeof obj !== 'object') return out;
    for(var k in obj){
      var v = obj[k];
      if(!v || typeof v !== 'object') continue;
      var sc = Number(v.score);
      if(!isFinite(sc) || sc <= 0) continue;
      out.push({
        name: cleanName(v.name) || cleanName(k) || '플레이어',
        score: Math.min(9999999, Math.round(sc)),
        lines: Math.max(0, Math.round(Number(v.lines)||0)),
        ts: Number(v.ts)||0
      });
    }
    return sortRows(out).slice(0, LIMIT);
  }
  function ago(ts){
    if(!ts) return '';
    var d = Math.max(0, Date.now()-ts)/1000;
    if(d < 60) return '방금';
    if(d < 3600) return Math.floor(d/60)+'분 전';
    if(d < 86400) return Math.floor(d/3600)+'시간 전';
    return Math.floor(d/86400)+'일 전';
  }
  function render(){
    var me = nick();
    if(rState === 'offline') subEl.textContent = 'TOP 10 · 오프라인 (이 기기 기록)';
    else if(rState === 'loading' && !rows.length) subEl.textContent = 'TOP 10 · 불러오는 중…';
    else subEl.textContent = 'TOP 10 · 점수 높은 순';

    if(!rows.length){
      var msg = rState === 'loading' ? '랭킹을 불러오고 있어요…'
        : rState === 'offline' ? '지금은 랭킹 서버에 연결할 수 없어요.<br>기록은 이 기기에 저장됩니다.'
        : '아직 기록이 없어요.<br>첫 번째 주인공이 되어 보세요!';
      listEl.innerHTML = '<div class="rkempty"><span class="ico">★</span>' + msg + '</div>';
    } else {
      var html = '';
      for(var i=0;i<rows.length;i++){
        var r = rows[i], rk = i+1;
        var cls = 'rkrow' + (me && cleanName(r.name) === me ? ' me' : '');
        var rkCls = 'rkn' + (rk <= 3 ? ' g'+rk : '');
        html += '<div class="'+cls+'">' +
          '<div class="'+rkCls+'">'+rk+'</div>' +
          '<div class="rkcell"><div class="nm">'+esc(r.name)+'</div>' +
          '<div class="sc">'+r.score.toLocaleString('ko-KR')+'점 · 줄 '+r.lines+(r.ts?' · '+ago(r.ts):'')+'</div></div>' +
          '<div class="hh">'+r.score.toLocaleString('ko-KR')+'</div>' +
        '</div>';
      }
      listEl.innerHTML = html;
    }
  }
  function load(){
    if(inflight) return inflight;
    rState = 'loading'; render();
    inflight = fetch(DB + '.json', { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(json){
        rows = normalize(json);
        rState = 'ok'; lastAt = Date.now(); inflight = null; render(); return rows;
      })
      .catch(function(){
        rows = sortRows(readLocal()).slice(0, LIMIT);
        rState = 'offline'; lastAt = Date.now(); inflight = null; render(); return rows;
      });
    return inflight;
  }
  function submit(name, sc, lines){
    var nm = cleanName(name);
    if(!nm) return Promise.resolve({ ok:false, msg:'닉네임을 먼저 입력해 주세요' });
    var s = Math.max(0, Math.round(Number(sc)||0));
    if(s <= 0) return Promise.resolve({ ok:false, msg:'점수가 있어야 등록돼요' });
    setNick(nm);

    var local = readLocal(), found = false;
    for(var i=0;i<local.length;i++){
      if(cleanName(local[i].name) === nm){
        found = true;
        if(s > local[i].score) local[i] = { name:nm, score:s, lines:lines, ts:Date.now() };
        break;
      }
    }
    if(!found) local.push({ name:nm, score:s, lines:lines, ts:Date.now() });
    writeLocal(sortRows(local));

    var url = DB + '/' + encodeURIComponent(nm) + '.json';
    return fetch(url, { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(prev){
        var ps = prev && isFinite(Number(prev.score)) ? Number(prev.score) : -1;
        if(s <= ps) return { ok:true, kept:true, msg:'이미 더 높은 내 기록이 있어요 (' + Math.round(ps).toLocaleString('ko-KR') + '점)' };
        return fetch(url, {
          method:'PUT',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ name:nm, score:s, lines:Math.max(0, Math.round(Number(lines)||0)), ts:Date.now() })
        }).then(function(r){
          if(!r.ok) throw new Error('HTTP '+r.status);
          return r.json();
        }).then(function(){ return { ok:true, kept:false, msg:s.toLocaleString('ko-KR')+'점을 올렸어요!' }; });
      })
      .then(function(res){ load(); return res; })
      .catch(function(){ return { ok:true, offline:true, msg:'지금은 연결이 안 돼 이 기기에만 저장했어요' }; });
  }
  function open(){
    panel.classList.add('show');
    render(); load();
    if(autoTimer) clearInterval(autoTimer);
    autoTimer = setInterval(function(){ load(); }, 20000);
  }
  function close(){
    panel.classList.remove('show');
    if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
    if(state === 'over') $('#overModal').classList.add('show');
  }
  return { nick:nick, setNick:setNick, load:load, submit:submit, open:open, close:close, render:render };
})();

/* =====================================================================
   ⏱ 시작 카운트다운 — 반투명 오버레이 + SVG 원형 게이지(3 · 2 · 1 · GO!)
   · 시작/다시 시작 제스처 안에서 오디오를 먼저 깨운 뒤 비프가 울린다.
   · 카운트다운이 끝난 순간에만 실제 게임 입력·타이머·낙하가 시작된다.
   ===================================================================== */
var Countdown = (function () {
  var R = 54, CIRC = 2 * Math.PI * R;
  var wrap = null, ring = null, head = null, num = null, hintEl = null;
  var steps = null, total = 1, t0 = 0, rafId = 0, live = false, shown = -1;
  var onTick = null, onDone = null, skippable = false;

  function build() {
    if (wrap) return;
    var css = document.createElement('style');
    css.textContent =
      '#cdWrap{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;display:none;align-items:center;justify-content:center;' +
      'background:radial-gradient(circle at 50% 45%,rgba(12,18,40,.20) 0%,rgba(8,12,28,.52) 100%);' +
      '-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px);opacity:0;transition:opacity .14s ease;' +
      'touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}' +
      '#cdWrap.on{display:flex;opacity:1;}' +
      '#cdBox{position:relative;width:min(64vmin,248px);height:min(64vmin,248px);display:flex;align-items:center;justify-content:center;}' +
      '#cdBox svg{position:absolute;left:0;top:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible;}' +
      '#cdTrack{fill:none;stroke:rgba(255,255,255,.24);stroke-width:7;}' +
      '#cdRing{fill:none;stroke-width:7;stroke-linecap:round;}' +
      '#cdNum{position:relative;font-weight:900;font-size:min(26vmin,100px);line-height:1;color:#fff;letter-spacing:-.02em;' +
      'font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;' +
      'text-shadow:0 4px 18px rgba(0,0,0,.42),0 0 26px rgba(255,255,255,.55);}' +
      '#cdNum.go{font-size:min(19vmin,74px);letter-spacing:.01em;}' +
      '#cdNum.tick{animation:cdPop .34s cubic-bezier(.2,1.5,.45,1) both;}' +
      '@keyframes cdPop{0%{transform:scale(1.95);opacity:0}55%{opacity:1}100%{transform:scale(1);opacity:1}}' +
      '#cdHint{position:absolute;left:-30%;right:-30%;bottom:-40px;text-align:center;font-weight:700;font-size:12.5px;line-height:1.4;' +
      'color:rgba(255,255,255,.9);text-shadow:0 2px 8px rgba(0,0,0,.45);' +
      'font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;' +
      'opacity:0;transition:opacity .2s;}';
    document.head.appendChild(css);

    wrap = document.createElement('div');
    wrap.id = 'cdWrap';
    wrap.setAttribute('aria-hidden', 'true');
    wrap.innerHTML =
      '<div id="cdBox">' +
        '<svg viewBox="0 0 120 120" aria-hidden="true">' +
          '<circle id="cdTrack" cx="60" cy="60" r="54"></circle>' +
          '<circle id="cdRing" cx="60" cy="60" r="54"></circle>' +
          '<circle id="cdHead" cx="60" cy="6" r="5" fill="#fff"></circle>' +
        '</svg>' +
        '<div id="cdNum">3</div>' +
        '<div id="cdHint"></div>' +
      '</div>';
    document.body.appendChild(wrap);

    ring = document.getElementById('cdRing');
    head = document.getElementById('cdHead');
    num = document.getElementById('cdNum');
    hintEl = document.getElementById('cdHint');
    ring.setAttribute('stroke-dasharray', CIRC.toFixed(2));
    ring.setAttribute('stroke-dashoffset', CIRC.toFixed(2));

    /* 카운트다운 중 터치가 게임으로 새지 않게 막고, 빠른 모드에서는 탭하면 바로 시작 */
    wrap.addEventListener('pointerdown', function (e) {
      e.stopPropagation();
      if (e.cancelable) e.preventDefault();
      if (live && skippable && performance.now() - t0 > 80) finish();
    }, true);
    wrap.addEventListener('click', function (e) { e.stopPropagation(); e.preventDefault(); }, true);
    wrap.addEventListener('touchstart', function (e) { e.stopPropagation(); }, true);
  }

  function setLabel(txt) {
    num.textContent = txt;
    num.className = '';
    void num.offsetWidth;           /* 애니메이션 재시작 */
    num.className = (txt.charAt(0) === 'G' ? 'go tick' : 'tick');
  }

  function frame() {
    if (!live) return;
    var el = performance.now() - t0;
    if (el >= total) { finish(); return; }
    var acc = 0, idx = 0;
    for (var i = 0; i < steps.length; i++) {
      acc += steps[i].d;
      if (el < acc) { idx = i; break; }
    }
    if (idx !== shown) {
      shown = idx;
      setLabel(steps[idx].t);
      if (onTick) { try { onTick(idx, steps[idx].t); } catch (err) {} }
    }
    var p = el / total;
    ring.setAttribute('stroke-dashoffset', (CIRC * (1 - p)).toFixed(2));
    head.setAttribute('transform', 'rotate(' + (p * 360).toFixed(1) + ' 60 60)');
    rafId = requestAnimationFrame(frame);
  }

  function finish() {
    if (!live) return;
    live = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    ring.setAttribute('stroke-dashoffset', '0');
    head.setAttribute('transform', 'rotate(360 60 60)');
    wrap.classList.remove('on');
    wrap.setAttribute('aria-hidden', 'true');
    var cb = onDone;
    onDone = null; onTick = null;
    if (cb) { try { cb(); } catch (err) { if (window.console) console.error(err); } }
  }

  function start(opt) {
    build();
    opt = opt || {};
    steps = opt.steps || [{ t: '3', d: 1000 }, { t: '2', d: 1000 }, { t: '1', d: 1000 }, { t: 'GO!', d: 350 }];
    total = 0;
    for (var i = 0; i < steps.length; i++) total += steps[i].d;
    onTick = opt.onTick || null;
    onDone = opt.onDone || null;
    skippable = !!opt.skippable;
    var accent = opt.accent || '#8EE7FF';
    ring.setAttribute('stroke', accent);
    ring.style.filter = 'drop-shadow(0 0 7px ' + accent + ')';
    head.setAttribute('fill', accent);
    ring.setAttribute('stroke-dashoffset', CIRC.toFixed(2));
    head.setAttribute('transform', 'rotate(0 60 60)');
    num.style.color = opt.textColor || '#fff';
    num.style.textShadow = opt.textShadow || '0 4px 18px rgba(0,0,0,.42),0 0 26px rgba(255,255,255,.55)';
    if (opt.veil) wrap.style.background = opt.veil;
    hintEl.style.color = opt.hintColor || 'rgba(255,255,255,.9)';
    hintEl.style.textShadow = opt.hintColor ? '0 1px 0 rgba(255,255,255,.5)' : '0 2px 8px rgba(0,0,0,.45)';
    hintEl.textContent = opt.hint || '';
    hintEl.style.opacity = opt.hint ? '1' : '0';
    wrap.classList.add('on');
    wrap.setAttribute('aria-hidden', 'false');
    live = true; shown = -1; t0 = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(frame);
  }

  return {
    start: start,
    finish: finish,
    get running() { return live; }
  };
})();

function startGame(){
  grid = emptyGrid();
  score = 0; linesTotal = 0; combo = 0; comboBest = 0;
  refreshCharge = 3; bombCharge = 2;
  nextRefresh = 1200; nextBomb = 2500;
  bombArmed = false;
  drag = null;
  particles = []; pops = []; clearAnim = null; banner = null; toast = null;
  inputBlocked = false;
  newBestThisRun = false;
  lastScoreShown = -1;
  state = 'ready';
  dealTray();
  updateHud();
  updateDock();
  $('#bestStart').textContent = best.toLocaleString('ko-KR');
  unlockAudio();            /* 시작 제스처 안에서 iOS 오디오 잠금 해제부터 */
  bgmStart();
  /* 빠른 카운트다운(약 1.3초) — 화면을 톡 누르면 바로 시작 */
  Countdown.start({
    accent: '#FFD34D',
    skippable: true,
    hint: '화면을 톡 누르면 바로 시작해요',
    steps: [{ t: '3', d: 350 }, { t: '2', d: 350 }, { t: '1', d: 350 }, { t: 'GO!', d: 250 }],
    onTick: sfxCount,
    onDone: function(){ state = 'play'; }
  });
}

/* =========================================================================
   15. 루프
   ========================================================================= */
var rafLast = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!rafLast) rafLast = ts;
  var dt = (ts - rafLast)/1000;
  rafLast = ts;
  if(!isFinite(dt) || dt < 0) dt = 0;
  if(dt > 0.1) dt = 0.1;
  timeS += dt;

  if(drag){
    drag.pop = Math.min(1, drag.pop + dt*3.2);
  }
  updateEffects(dt);
  render();
}

var resizeTimer = 0;
function onResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    layout();
  }, 80);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

/* =========================================================================
   16. 초기화
   ========================================================================= */
function init(){
  layout();
  grid = emptyGrid();
  dealTray();
  updateSfxBtn();
  updateHud();
  updateDock();
  $('#bestStart').textContent = best.toLocaleString('ko-KR');
  try{
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if(isIOS) $('#sndHint').hidden = false;
  }catch(e){}

  // 랭킹 미리 데우기 (조용히)
  setTimeout(function(){ try{ Rank.load(); }catch(e){} }, 1400);

  requestAnimationFrame(frame);
}

/* ---------- 검증용 (#debug) ---------- */
if(location.hash === '#debug'){
  window.__bb = {
    get grid(){ return grid.map(function(r){ return r.slice(); }); },
    get tray(){ return tray.map(function(p){ return p ? {id:p.id,w:p.w,h:p.h,cells:p.cells.map(function(c){return c.slice();}),color:p.color} : null; }); },
    get score(){ return score; },
    get best(){ return best; },
    get combo(){ return combo; },
    get comboBest(){ return comboBest; },
    get lines(){ return linesTotal; },
    get state(){ return state; },
    get particles(){ return particles.length; },
    get bannerText(){ return banner ? banner.text : null; },
    get bannerSub(){ return banner ? banner.sub : null; },
    get drag(){ return drag ? {idx:drag.idx, anchorR:drag.anchorR, anchorC:drag.anchorC, r0:drag.r0, c0:drag.c0, valid:drag.valid, left:drag.left, top:drag.top, lift:drag.lift} : null; },
    get anim(){ return clearAnim ? 1 : 0; },
    get blocked(){ return inputBlocked; },
    get refreshCharge(){ return refreshCharge; },
    get bombCharge(){ return bombCharge; },
    get bombArmed(){ return bombArmed; },
    audioState: function(){ return actx ? actx.state : 'none'; },
    audioSession: function(){ try{ return navigator.audioSession ? navigator.audioSession.type : 'none'; }catch(e){ return 'err'; } },
    keepAlive: function(){ return keepAliveEl ? (keepAliveEl.paused ? 'paused' : 'playing') : 'none'; },
    muted: function(){ return muted; },
    bgmOn: function(){ return !!bgmTimer; },
    unlock: unlockAudio,
    start: startGame,
    layout: function(){ return { x:GEO.x, y:GEO.y, size:GEO.size, cell:GEO.cell, gap:GEO.gap, W:W, H:H, trayY:trayY, trayH:trayH, dpr:dpr }; },
    slotRect: slotRect,
    pieceBox: function(i){ return tray[i] ? pieceBox(tray[i], i) : null; },
    canPlace: function(i,r,c){ return tray[i] ? canPlace(tray[i], r, c) : false; },
    findSpot: function(i){ return tray[i] ? findSpot(tray[i]) : null; },
    anyPlace: function(i){ return tray[i] ? anyPlace(tray[i]) : false; },
    placeAt: function(i,r,c){ return placePiece(i,r,c); },
    setGrid: function(rows){
      if(!rows || rows.length !== 8) return false;
      for(var r=0;r<8;r++) for(var c=0;c<8;c++) grid[r][c] = rows[r][c];
      return true;
    },
    setTray: function(ids){
      tray = ids.map(function(id){
        if(!id) return null;
        for(var i=0;i<SHAPES.length;i++) if(SHAPES[i].id === id) return makePiece(SHAPES[i]);
        return null;
      });
      updateDock();
      return true;
    },
    emptyRow: function(r){
      for(var c=0;c<8;c++) grid[r][c] = -1;
    },
    fillRow: function(r, upto, color){
      for(var c=0;c<upto;c++) grid[r][c] = color == null ? 3 : color;
      for(var c2=upto;c2<8;c2++) grid[r][c2] = -1;
    },
    deal: dealTray,
    checkTurn: afterTurn,
    bombAt: useBombAt,
    refresh: useRefresh,
    endGame: endGame,
    sfxClear: sfxClear,
    sfxCombo: sfxCombo,
    freeze: function(v){ animFreeze = !!v; },
    get animT(){ return clearAnim ? clearAnim.t : -1; },
    set animT(v){ if(clearAnim) clearAnim.t = v; },
    shake: shake,
    version: VERSION
  };
}

init();

})();
</script>
</body>
</html>
